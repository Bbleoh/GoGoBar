<!DOCTYPE html>
<html lang="it" data-filodiffusione>
<head>
  <meta charset="UTF-8" />
  <!-- filodiffusione: tra le pagine con data-filodiffusione la musica non si ferma (vedi js/filodiffusione.js) -->
  <script src="../js/filodiffusione.js?v=2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Musica · GoGoBar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0c; --surface: #161614; --raised: #1d1d1a; --line: #2a2a26;
      --ivory: #f4efe2; --cream: #c9c0a9; --muted: #77715f;
      --gold: #e4b33c; --gold-2: #f6d77a;
      --display: 'Fredoka', 'DM Sans', sans-serif; --mono: 'DM Mono', monospace; --sans: 'DM Sans', sans-serif;
      --pad: clamp(1rem, 4vw, 4rem);
    }
    body { background: var(--bg); color: var(--ivory); font-family: var(--sans); min-height: 100vh; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    /* barra in alto */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem var(--pad); border-bottom: 1px solid var(--line); }
    .top a { color: var(--cream); text-decoration: none; font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
    .top a:hover { color: var(--gold); }
    .top a.logo { font-family: var(--display); font-size: 2rem; line-height: 1; letter-spacing: 0; text-transform: none; color: var(--ivory); font-weight: 700; }
    .top a.logo { display: inline-flex; align-items: center; gap: .4rem; }
    .top a.logo img { width: 1.15em; height: 1.15em; display: block; }
    .logo em { color: var(--gold); font-style: normal; }

    /* ── PLAYER ── */
    .player {
      display: grid; grid-template-columns: auto 1fr; align-items: center; gap: clamp(1.5rem, 4vw, 3.5rem);
      padding: clamp(2rem, 5vw, 3.5rem) var(--pad); border-bottom: 1px solid var(--line);
      max-width: 1200px; margin: 0 auto;
    }

    /* vinile che gira */
    .disc {
      position: relative; width: clamp(180px, 26vw, 300px); aspect-ratio: 1; border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, transparent 0 31%, rgba(255,255,255,.04) 31.5% 32%, transparent 32.5%),
        repeating-radial-gradient(circle at 50% 50%, #111 0 2px, #191917 2px 4px);
      box-shadow: 0 0 0 6px #0d0d0c, 0 0 0 8px var(--gold), 0 20px 40px rgba(0,0,0,.6);
      animation: gira 3.2s linear infinite; animation-play-state: paused;
    }
    .disc::after { /* riflesso */
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 30deg, transparent 0 10%, rgba(255,255,255,.07) 15%, transparent 22% 60%, rgba(255,255,255,.05) 65%, transparent 72%);
    }
    .disc .label {
      position: absolute; inset: 31%; border-radius: 50%;
      background: var(--gold); display: grid; place-items: center; overflow: hidden;
      box-shadow: inset 0 0 0 3px #b98a22;
    }
    .disc .label img { width: 78%; height: auto; margin-top: 12%; }
    .disc .label.foto img { width: 100%; height: 100%; margin: 0; object-fit: cover; }
    .disc .label::after { content: ''; position: absolute; width: 8%; aspect-ratio: 1; border-radius: 50%; background: var(--bg); }
    .playing .disc { animation-play-state: running; }
    @keyframes gira { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .disc { animation: none; } .eq i { animation: none !important; } }

    .info { min-width: 0; }
    .kicker { font-family: var(--mono); font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
    .info h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1; margin: .5rem 0 .6rem; overflow-wrap: anywhere; }
    .artisti { color: var(--cream); font-size: 1.05rem; line-height: 1.45; }
    .prod { margin-top: .25rem; font-family: var(--mono); font-size: .75rem; color: var(--muted); letter-spacing: .06em; }

    .seek { margin-top: 1.6rem; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .8rem; font-family: var(--mono); font-size: .75rem; color: var(--cream); }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px; background: var(--line); outline-offset: 4px; cursor: pointer;
      background-image: linear-gradient(var(--gold), var(--gold)); background-size: var(--p, 0%) 100%; background-repeat: no-repeat; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--gold-2); border: 3px solid var(--bg); }
    input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--gold-2); border: 3px solid var(--bg); }

    .controls { margin-top: 1.4rem; display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
    .ctrl { width: 3rem; height: 3rem; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); transition: border-color .2s, color .2s, transform .15s; }
    .ctrl:hover { border-color: var(--gold); color: var(--gold-2); }
    .ctrl svg { width: 1.1rem; height: 1.1rem; fill: currentColor; }
    .ctrl.play { width: 4rem; height: 4rem; background: var(--gold); color: #1a1408; border-color: var(--gold); }
    .ctrl.play:hover { background: var(--gold-2); color: #1a1408; transform: scale(1.05); }
    .ctrl.play svg { width: 1.5rem; height: 1.5rem; }
    .ctrl.on { color: var(--gold); border-color: var(--gold); }
    .ctrl.play.riprendi { animation: riprendi 1.4s ease-in-out infinite; }
    @keyframes riprendi { 0%, 100% { box-shadow: 0 0 0 0 rgba(228,179,60,.7); } 50% { box-shadow: 0 0 0 12px rgba(228,179,60,0); } }
    .vol { display: flex; align-items: center; gap: .5rem; margin-left: auto; color: var(--muted); }
    .vol input { width: 110px; }

    /* ── ALBUM: una copertina per album ── */
    .shelf { max-width: 1200px; margin: 0 auto; padding: 2.5rem var(--pad) 0; }
    .shelf h2 { font-family: var(--display); font-weight: 700; font-size: 1.8rem; margin-bottom: 1rem; }
    .shelf-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
    .album { text-align: left; display: flex; flex-direction: column; gap: .55rem; }
    .album .gg-cover { border-radius: 14px; border: 1px solid var(--line); transition: transform .25s, border-color .25s, box-shadow .25s; }
    .album:hover .gg-cover { transform: translateY(-4px); border-color: var(--gold); box-shadow: 0 14px 30px rgba(0,0,0,.5); }
    .album.attivo .gg-cover { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
    .album .nome { font-family: var(--display); font-weight: 600; font-size: 1.15rem; line-height: 1.1; }
    .album.attivo .nome { color: var(--gold-2); }
    .album .quanti { font-family: var(--mono); font-size: .72rem; color: var(--muted); }

    /* ── SCALETTA ── */
    .list { max-width: 1200px; margin: 0 auto; padding: 2.5rem var(--pad) 4rem; }
    .list h2 { font-family: var(--display); font-weight: 700; font-size: 1.8rem; margin-bottom: 1rem; }
    .list h2 small { font-family: var(--mono); font-weight: 400; font-size: .8rem; color: var(--muted); margin-left: .5rem; }
    .list ol + h2 { margin-top: 2.5rem; }
    ol { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .track {
      display: grid; grid-template-columns: 2.4rem minmax(0, 1fr) auto; align-items: center; gap: 1rem;
      width: 100%; text-align: left; padding: .85rem 1rem; border-radius: 12px; transition: background .2s;
    }
    .track:hover { background: var(--surface); }
    .track .n { font-family: var(--mono); font-size: .8rem; color: var(--muted); text-align: center; }
    .track .t { font-family: var(--display); font-weight: 600; font-size: 1.1rem; }
    .track .a { display: block; font-size: .85rem; color: var(--cream); margin-top: .15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track .d { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
    .track.attivo { background: var(--raised); }
    .track.attivo .t { color: var(--gold-2); }
    .track .eq { display: none; height: 14px; align-items: flex-end; justify-content: center; gap: 2px; }
    .track.attivo .eq { display: flex; }
    .track.attivo .num { display: none; }
    .eq i { width: 3px; background: var(--gold); border-radius: 2px; height: 30%; animation: eq .9s ease-in-out infinite; animation-play-state: paused; }
    .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
    .playing .eq i { animation-play-state: running; }
    @keyframes eq { 0%,100% { height: 25%; } 50% { height: 100%; } }

    /* retro del vinile come scaletta: si clicca sui titoli stampati */
    /* disco: fronte che ondeggia da solo; on hover (o tap su telefono) si gira sul retro con la tracklist */
    .retro-scena { width: min(100%, 640px); margin: 0 auto; perspective: 1100px; }
    .retro-vinile.ondeggia { animation: ondeggia 8s ease-in-out infinite; }
    @keyframes ondeggia {
      0%, 100% { transform: rotateY(0deg) rotateX(0deg) rotateZ(0deg); }
      25% { transform: rotateY(-7deg) rotateX(3deg) rotateZ(-.6deg); }
      50% { transform: rotateY(1deg) rotateX(-2.5deg) rotateZ(.3deg); }
      75% { transform: rotateY(7deg) rotateX(2deg) rotateZ(.6deg); }
    }
    .retro-vinile { position: relative; aspect-ratio: 1; transform-style: preserve-3d; transition: transform .2s ease-out; }
    .retro-vinile.girando { transition: transform .75s cubic-bezier(.3,.7,.3,1); }
    .retro-vinile .faccia { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.55); background: #111; }
    .retro-vinile .faccia > img, .retro-vinile .faccia > .gg-cover { width: 100%; height: 100%; border-radius: 0; border: 0; }
    .retro-vinile .faccia.dietro { transform: rotateY(180deg); }
    .retro-vinile .faccia.dietro::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
      background: radial-gradient(circle at var(--lx, 50%) var(--ly, 50%), rgba(255,255,255,.16), transparent 55%); }
    .retro-scena:hover .faccia.dietro::after { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .retro-vinile.ondeggia { animation: none; } }
    .gruppo[hidden] { display: none; }
    /* album a pagamento (GoGoldBar) */
    .album { position: relative; }
    .album .lucchetto, .gruppo .lucchetto { display: inline-flex; align-items: center; gap: .3rem; font-family: var(--display); font-weight: 700; color: var(--gold-2); }
    .album .lucchetto { position: absolute; top: .5rem; left: .5rem; z-index: 2; background: rgba(13,13,12,.88); border: 1px solid var(--gold); border-radius: 999px; padding: .25rem .6rem; font-size: .85rem; }
    .album.chiuso .gg-cover { filter: grayscale(.85) brightness(.55); }
    .gruppo .sblocca { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin: 0 auto 1rem; max-width: 760px;
      background: var(--surface, #161614); border: 1px solid var(--gold); border-radius: 14px; padding: .9rem 1.1rem; }
    .gruppo .sblocca button { border: 1px solid var(--gold); background: var(--gold); color: #1a1408; border-radius: 999px; padding: .55rem 1.1rem; font-family: var(--display); font-weight: 600; font-size: 1rem; cursor: pointer; }
    .gruppo.chiuso ol { opacity: .45; }
    .ggb-ico { width: 1em; height: 1em; }
    .retro-vinile img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .retro-vinile .hot { position: absolute; border-radius: 8px; transition: background .2s; }
    .retro-vinile .hot:hover, .retro-vinile .hot:focus-visible { background: rgba(255, 236, 170, .22); outline: none; }
    .retro-vinile .hot.attivo { background: rgba(228, 179, 60, .32); }
    .retro-vinile .hot .eq { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); display: none; height: 14px; align-items: flex-end; gap: 2px; }
    .retro-vinile .hot.attivo .eq { display: flex; }
    .retro-vinile .hot .eq i { background: #1a1408; }
    .retro-nota { text-align: center; margin: 1.6rem 0 0; font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

    .empty { font-family: var(--mono); color: var(--muted); padding: 3rem var(--pad); }

    @media (max-width: 760px) {
      .player { grid-template-columns: 1fr; justify-items: center; text-align: center; }
      .info { width: 100%; }
      .controls { justify-content: center; }
      .vol { margin-left: 0; width: 100%; justify-content: center; }
      .track { grid-template-columns: 2rem minmax(0, 1fr) auto; gap: .7rem; padding: .75rem .6rem; }
      .top a.logo { font-size: 1.55rem; }
    }
  </style>
  <link rel="icon" href="../favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/icone/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../img/icone/favicon-16.png">
  <link rel="apple-touch-icon" href="../img/icone/apple-touch-icon.png">
</head>
<body data-radio="nascosta">

<div class="top">
  <a href="../" class="logo"><img src="../img/icone/icona-96.png" alt="" width="40" height="40">Go<em>Go</em>Bar</a>
  <a href="../">← Home</a>
</div>

<section class="player" id="player">
  <div class="disc" aria-hidden="true"><div class="label" id="etichetta"><img id="etichetta-img" src="../img/maneki-neko.webp" alt=""></div></div>
  <div class="info">
    <p class="kicker" id="kicker">Musica</p>
    <h1 id="titolo">—</h1>
    <p class="artisti" id="artisti"></p>
    <p class="prod" id="prod"></p>

    <div class="seek">
      <span id="ora">0:00</span>
      <input type="range" id="barra" min="0" max="1000" value="0" aria-label="Posizione nel brano">
      <span id="tot">0:00</span>
    </div>

    <div class="controls">
      <button class="ctrl" id="loop" aria-label="Ripeti il brano" aria-pressed="false" title="Ripeti il brano"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zM17 17H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
      <button class="ctrl" id="prev" aria-label="Brano precedente"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="ctrl play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="icona"><path d="M7 4v16l13-8z"/></svg></button>
      <button class="ctrl" id="next" aria-label="Brano successivo"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>
      <button class="ctrl" id="shuffle" aria-label="Ordine casuale" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M17 4l4 4-4 4V9h-2.6l-2.5 3 2.5 3H17v-3l4 4-4 4v-3h-3.4L10 14.6 6.4 19H3v-2h2.4l3.3-4L5.4 9H3V7h3.4L10 11.4 13.6 7H17z"/></svg></button>
      <label class="vol"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg><input type="range" id="volume" min="0" max="100" value="90" aria-label="Volume"></label>
    </div>
  </div>
</section>

<section class="shelf" id="album" aria-label="Album">
  <h2>Album</h2>
  <div class="shelf-row" id="scaffale"></div>
</section>

<section class="list" id="scaletta"></section>

<script src="../contenuti.js?v=25"></script>
<script src="../js/copertina.js?v=2"></script>
<script src="../js/account.js?v=5"></script>
<script src="../js/gogoldbar.js?v=7"></script>
<script src="../js/radio.js?v=15"></script>
<script>
/*
 * Player musicale: legge i brani da contenuti.js (sezione musica).
 * Ogni brano ha il suo link: musica/#nome-del-file (senza .mp3).
 */
(function () {
  // i brani sono quelli della radio (stesso ordine), che suona per tutta la pagina e oltre
  const R = window.GoGoBarRadio;
  const brani = R ? R.brani : [];
  const $ = id => document.getElementById(id);
  const audio = R && R.audio;

  if (!brani.length) {
    $('player').outerHTML = '<p class="empty">Silenzio, per ora. Presto rumori forti.</p>';
    return;
  }

  const slug = b => b.file.replace(/\.[^.]+$/, '');
  const mmss = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
  const ICONA_PLAY  = '<path d="M7 4v16l13-8z"/>';
  const ICONA_PAUSA = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';

  // posizione di ogni brano dentro il suo album (es. 2 di 8)
  const pos = brani.map(b => {
    const stesso = brani.filter(x => x.album === b.album);
    return { n: stesso.indexOf(b) + 1, tot: stesso.length };
  });

  // dati completi degli album (copertina, retro, mappa dei titoli sul retro)
  const INFO_ALBUM = new Map(((typeof CONTENUTI !== 'undefined' && CONTENUTI.musica) || []).map(a => [a.album, a]));
  const percorso = f => /^(https?:)?\/\//.test(f) ? f : '../' + f;

  const slugAlbum = n => String(n || 'brani').toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  // ── scaffale: una copertina per album, click = suona l'album dall'inizio ──
  const album = [...new Set(brani.map(b => b.album))];
  if (album.length < 2 && !brani.some(b => b.copertina)) $('album').remove();
  else album.forEach(function (nome) {
    const lista = brani.filter(b => b.album === nome);
    const btn = document.createElement('button');
    btn.className = 'album'; btn.dataset.album = nome || '';
    btn.setAttribute('aria-label', 'Ascolta l\'album ' + (nome || 'Brani'));
    const t = document.createElement('span'); t.className = 'nome'; t.textContent = nome || 'Brani';
    const q = document.createElement('span'); q.className = 'quanti'; q.textContent = lista.length === 1 ? '1 brano' : lista.length + ' brani';
    if (window.GoGoCopertina) btn.append(GoGoCopertina({ album: nome || 'Brani', copertina: lista[0].copertina }, '../'));
    btn.append(t, q);
    btn.onclick = function () {
      // seleziona il disco: sotto compare il suo retro con la tracklist
      mostraAlbum(nome);
      $('scaletta').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    $('scaffale').append(btn);
  });

  // ── scaletta, divisa per album ──
  let ol = null, ultimo;
  brani.forEach(function (b, i) {
    if (!ol || b.album !== ultimo) {
      ultimo = b.album;
      ol = document.createElement('ol');
      const gruppo = document.createElement('div');
      gruppo.className = 'gruppo'; gruppo.dataset.album = b.album || '';
      gruppo.id = 'album-' + slugAlbum(b.album);
      gruppo.append(ol);
      $('scaletta').append(gruppo);
      // se l'album ha il retro con la mappa dei titoli, la scaletta è il retro stesso
      const info = INFO_ALBUM.get(b.album) || {};
      const quanti = brani.filter(x => x.album === b.album).length;
      if (info.retro && Array.isArray(info.mappa) && info.mappa.length === quanti) {
        const retro = document.createElement('div');
        retro.className = 'retro-vinile ondeggia';
        const fronte = document.createElement('div'); fronte.className = 'faccia fronte';
        if (window.GoGoCopertina) fronte.append(GoGoCopertina({ album: b.album || 'Brani', copertina: b.copertina }, '../'));
        const dietro = document.createElement('div'); dietro.className = 'faccia dietro';
        const img = document.createElement('img');
        img.src = percorso(info.retro); img.alt = 'Retro di ' + b.album + ' con la tracklist';
        dietro.append(img);
        retro.append(fronte, dietro);
        const scena = document.createElement('div');
        scena.className = 'retro-scena';
        scena.append(retro);
        inclina(scena, retro);
        const nota = document.createElement('p');
        nota.className = 'retro-nota'; nota.textContent = matchMedia('(hover: none)').matches ? 'Tocca la copertina per girarla, tocca un titolo per ascoltarlo' : 'Passa sul disco e clicca un titolo per ascoltarlo';
        ol.replaceWith(scena);
        scena.after(nota);
        ol = null; ultimo = b.album;
        ol = { retro: dietro, mappa: info.mappa, k: 0 };
      }
    }
    if (ol && ol.retro) {
      const [x, y, w, h] = ol.mappa[ol.k++];
      const hot = document.createElement('button');
      hot.className = 'hot'; hot.dataset.i = i;
      hot.style.cssText = `left:${x}%;top:${y}%;width:${w}%;height:${h}%`;
      hot.setAttribute('aria-label', pos[i].n + '. ' + b.titolo + (b.artisti ? ' — ' + b.artisti : '') + (b.durata ? ' (' + b.durata + ')' : ''));
      hot.title = b.titolo + (b.durata ? ' · ' + b.durata : '');
      const eq = document.createElement('span'); eq.className = 'eq'; eq.innerHTML = '<i></i><i></i><i></i>';
      hot.append(eq);
      ol.retro.append(hot);
      return;
    }
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'track'; btn.dataset.i = i;
    const n = document.createElement('span'); n.className = 'n';
    const num = document.createElement('span'); num.className = 'num'; num.textContent = pos[i].n;
    const eq = document.createElement('span'); eq.className = 'eq'; eq.innerHTML = '<i></i><i></i><i></i>';
    n.append(num, eq);
    const mid = document.createElement('span');
    const t = document.createElement('span'); t.className = 't'; t.textContent = b.titolo;
    const a = document.createElement('span'); a.className = 'a'; a.textContent = b.artisti || '';
    mid.append(t, a);
    const d = document.createElement('span'); d.className = 'd'; d.textContent = b.durata || '';
    btn.append(n, mid, d);
    li.append(btn);
    ol.append(li);
  });

  // un disco alla volta: si vede solo la scaletta dell'album selezionato
  function mostraAlbum(nome) {
    nome = nome || '';
    document.querySelectorAll('#scaletta .gruppo').forEach(g => { g.hidden = g.dataset.album !== nome; });
    document.querySelectorAll('.album').forEach(el => el.classList.toggle('attivo', el.dataset.album === nome));
  }

  // il disco: on hover si gira sul retro e segue il mouse con un leggero tilt; l'angolo si calcola
  // sulla "scena" (che non si muove), così i titoli cliccabili non tremano. Su touch: tap = gira.
  function inclina(scena, retro) {
    const touch = matchMedia('(hover: none)').matches;
    const MAX = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 7;
    let timer;
    // l'ondeggiamento si ferma dov'è (si copia l'angolo attuale) e da lì parte il giro, senza scatti
    function gira(su) {
      scena.classList.toggle('girata', su);
      clearTimeout(timer);
      if (su) {
        retro.style.transform = getComputedStyle(retro).transform;
        retro.classList.remove('ondeggia');
        void retro.offsetWidth;
      }
      retro.classList.add('girando');
      retro.style.transform = su ? 'rotateY(180deg)' : 'rotateY(0deg)';
      timer = setTimeout(function () {
        retro.classList.remove('girando');
        if (!su) { retro.style.transform = ''; retro.classList.add('ondeggia'); }
      }, 750);
    }
    if (touch) {
      // tap sulla copertina = gira sul retro; sul retro, tap su un titolo = suona, tap altrove = torna al fronte
      scena.addEventListener('click', function (e) {
        const girata = scena.classList.contains('girata');
        if (girata && e.target.closest('.hot')) return;
        e.stopPropagation(); e.preventDefault(); gira(!girata);
      }, true);
      return;
    }
    scena.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') gira(true); });
    scena.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') gira(false); });
    scena.addEventListener('pointermove', function (e) {
      if (e.pointerType !== 'mouse' || retro.classList.contains('girando')) return;
      const r = scena.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      // girato di 180°, l'asse X si inverte: per questo rotateX ha segno +
      retro.style.transform = `rotateY(${(180 + x * 2 * MAX).toFixed(2)}deg) rotateX(${(y * 2 * MAX).toFixed(2)}deg)`;
      retro.style.setProperty('--lx', (x + .5) * 100 + '%');
      retro.style.setProperty('--ly', (y + .5) * 100 + '%');
    });
  }

  // ── il player è la radio (js/radio.js): stesso audio e stessa coda in tutto il sito, così con la
  //    filodiffusione la musica continua quando cambi pagina. Qui sotto c'è solo come si vede e i comandi. ──
  const G = window.GoGoldBar;
  function chiediAlbum(nome) { if (G) G.chiediSblocco(G.sbloccoDi(nome)); }
  let trascinando = false;

  function mostraBrano() {
    const i = R.corrente(), b = brani[i];
    if (!b) return;
    $('titolo').textContent = b.titolo;
    $('artisti').textContent = b.artisti || '';
    $('prod').textContent = b.prod ? 'prod. ' + b.prod : '';
    $('kicker').textContent = (b.album ? b.album + ' · ' : '') + pos[i].n + ' di ' + pos[i].tot;
    $('tot').textContent = b.durata || '0:00';
    document.title = b.titolo + ' · GoGoBar';
    document.querySelectorAll('.track, .hot').forEach(el => el.classList.toggle('attivo', +el.dataset.i === i));
    mostraAlbum(b.album);
    // al centro del vinile: la copertina dell'album, se c'è, altrimenti il gatto
    $('etichetta').classList.toggle('foto', !!b.copertina);
    $('etichetta-img').src = b.copertina ? (/^(https?:)?\/\//.test(b.copertina) ? b.copertina : '../' + b.copertina) : '../img/maneki-neko.webp';
    history.replaceState(history.state, '', '#' + slug(b));
    mostraTempo();
  }
  function mostraStato() {
    const on = !audio.paused;
    document.body.classList.toggle('playing', on);
    $('icona').innerHTML = on ? ICONA_PAUSA : ICONA_PLAY;
    $('play').setAttribute('aria-label', on ? 'Pausa' : 'Play');
    $('play').classList.toggle('riprendi', R.inAttesa());    // il browser ha bloccato la ripartenza: un tocco e va
  }
  function mostraTempo() {
    if (trascinando) return;
    if (!audio.duration) { $('ora').textContent = '0:00'; aggiornaBarra(0); return; }
    $('tot').textContent = mmss(audio.duration);
    $('ora').textContent = mmss(audio.currentTime);
    aggiornaBarra(audio.currentTime / audio.duration);
  }
  function aggiornaBarra(frazione) {
    $('barra').value = Math.round(frazione * 1000);
    $('barra').style.setProperty('--p', (frazione * 100) + '%');
  }
  function segnaTasti() {
    $('loop').classList.toggle('on', R.loop()); $('loop').setAttribute('aria-pressed', R.loop());
    $('shuffle').classList.toggle('on', R.casuale()); $('shuffle').setAttribute('aria-pressed', R.casuale());
  }
  R.ascolta(function (tipo) {
    if (tipo === 'brano') mostraBrano();
    else if (tipo === 'stato') mostraStato();
    else if (tipo === 'tempo') mostraTempo();
    else segnaTasti();
  });

  // lucchetti sugli album a pagamento: sullo scaffale e sopra la scaletta
  function lucchetti() {
    if (!G) return;
    document.querySelectorAll('.album').forEach(function (btn) {
      const nome = btn.dataset.album, c = G.albumBloccato(nome);
      btn.classList.toggle('chiuso', c);
      let l = btn.querySelector('.lucchetto');
      if (c && !l) {
        l = document.createElement('span'); l.className = 'lucchetto';
        l.innerHTML = '🔒 ' + G.formatta(G.SBLOCCHI[G.sbloccoDi(nome)].prezzo) + ' ' + G.icona;
        btn.append(l);
      }
      if (!c && l) l.remove();
    });
    document.querySelectorAll('#scaletta .gruppo').forEach(function (g) {
      const nome = g.dataset.album, c = G.albumBloccato(nome);
      g.classList.toggle('chiuso', c);
      let s = g.querySelector('.sblocca');
      if (c && !s) {
        s = document.createElement('div'); s.className = 'sblocca';
        const t = document.createElement('span');
        t.textContent = '🔒 Album bloccato · ' + G.valuta(G.SBLOCCHI[G.sbloccoDi(nome)].prezzo);
        const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Sblocca';
        b.onclick = () => chiediAlbum(nome);
        s.append(t, b);
        g.prepend(s);
      }
      if (!c && s) s.remove();
    });
  }
  if (G) { G.suCambio(lucchetti); G.pronto.then(lucchetti); }
  lucchetti();

  // ── comandi ──
  $('play').onclick = () => R.playPausa();
  $('next').onclick = () => R.avanti();
  $('prev').onclick = () => R.indietro();
  $('loop').onclick = () => R.loop(!R.loop());          // ripete il brano (resta attivo anche se cambi brano)
  $('shuffle').onclick = () => R.casuale(!R.casuale());
  $('scaletta').addEventListener('click', e => {
    const t = e.target.closest('.track, .hot'); if (!t) return;
    const i = +t.dataset.i;
    if (i === R.corrente()) R.playPausa();
    else R.carica(i, true);
  });
  $('barra').addEventListener('input', function () {
    trascinando = true;
    const f = this.value / 1000;
    aggiornaBarra(f);
    if (audio.duration) $('ora').textContent = mmss(f * audio.duration);
  });
  $('barra').addEventListener('change', function () {
    if (audio.duration) audio.currentTime = (this.value / 1000) * audio.duration;
    trascinando = false;
  });
  $('volume').value = Math.round(audio.volume * 100);
  $('volume').style.setProperty('--p', $('volume').value + '%');
  $('volume').addEventListener('input', function () {
    audio.volume = this.value / 100;
    this.style.setProperty('--p', this.value + '%');
  });

  // spazio = play/pausa (se non stai scrivendo in un campo)
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)) {
      e.preventDefault(); R.playPausa();
    }
  });

  // apertura con un link musica/#brano: se sta già suonando qualcosa non lo interrompe,
  // mostra solo l'album del brano; altrimenti prepara quel brano (parte col play)
  const iniziale = brani.findIndex(b => slug(b) === location.hash.slice(1));
  if (iniziale >= 0 && !R.occupata()) R.carica(iniziale, false);
  mostraBrano(); mostraStato(); segnaTasti();
  if (iniziale >= 0 && R.occupata()) mostraAlbum(brani[iniziale].album);
})();
</script>
</body>
</html>
