<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Corri Marf! · GoGoBar</title>
  <meta name="description" content="Marf corre e scappa dalle femmine. Quanto lontano arrivi?">
  <meta property="og:title" content="Corri Marf!">
  <meta property="og:description" content="Marf corre e scappa dalle femmine. Quanto lontano arrivi?">
  <meta property="og:image" content="copertina.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0c; --surface: #161614; --line: #2a2a26; --ivory: #f4efe2; --cream: #c9c0a9;
      --muted: #77715f; --gold: #e4b33c; --red: #d2452f; --pink: #ff5c8a;
      --display: 'Fredoka', sans-serif; --mono: 'DM Mono', monospace;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--ivory); font-family: var(--display);
      display: flex; flex-direction: column; align-items: center;
      overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    .bar {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: .7rem 16px; border-bottom: 1px solid var(--line);
    }
    .bar a, .bar button { font-family: var(--mono); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--cream); text-decoration: none; background: none; border: 0; cursor: pointer; }
    .bar a:hover, .bar button:hover { color: var(--gold); }
    .bar h1 { font-size: 1.3rem; font-weight: 700; }
    .bar h1 span { color: var(--gold); }
    .stage { position: relative; flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding: 12px; min-height: 0; }
    .schermo { position: relative; }
    canvas { display: block; border-radius: 18px; border: 1px solid var(--line); background: #15131c; }
    .hint { font-family: var(--mono); font-size: .72rem; color: var(--muted); padding: 0 16px 12px; text-align: center; letter-spacing: .05em; }

    /* pannelli sopra il gioco (menu e fine partita) */
    .pannello {
      position: absolute; inset: 0; border-radius: 18px; overflow: hidden;
      background: rgba(13,13,12,.78); backdrop-filter: blur(3px);
      display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); align-items: center;
    }
    .pannello[hidden] { display: none; }
    .pannello .ritratto { height: 92%; align-self: end; background: url(marf.webp) center bottom / contain no-repeat; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }

    /* schermata d'avvio: Marf scontornato con il logo davanti */
    #menu { background: radial-gradient(ellipse at 30% 60%, rgba(228,179,60,.16), transparent 60%), rgba(13,13,12,.55); grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); }
    .poster { position: relative; height: 100%; }
    .poster img { position: absolute; left: 50%; bottom: -4%; height: 104%; transform: translateX(-50%); filter: drop-shadow(0 14px 24px rgba(0,0,0,.55)); animation: respiro 2.4s ease-in-out infinite; }
    @keyframes respiro { 50% { transform: translateX(-50%) translateY(-1.5%); } }
    .logo {
      position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%) rotate(-7deg);
      text-align: center; line-height: .82; white-space: nowrap; pointer-events: none;
      font-family: var(--display); font-weight: 700; font-size: clamp(30px, 7.4vw, 92px);
    }
    .logo span { display: block; -webkit-text-stroke: .07em #1b1530; paint-order: stroke fill; text-shadow: 0 .09em 0 #1b1530, 0 .16em .25em rgba(0,0,0,.45); }
    .logo .uno { font-size: .58em; color: var(--ivory); transform: translateX(-.55em); }
    .logo .due { color: var(--gold); background: linear-gradient(180deg, #f6d77a 15%, #e4b33c 55%, #c98a1c); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .logo .due { filter: drop-shadow(0 .09em 0 #1b1530); text-shadow: none; }
    .pannello .testo { padding: 4% 6% 4% 2%; display: flex; flex-direction: column; gap: .7em; font-size: clamp(11px, 1.7vw, 17px); max-height: 100%; overflow: auto; }
    .pannello h2 { font-size: 2.6em; line-height: 1; color: var(--gold); }
    .pannello .sotto { font-size: 1.15em; color: var(--ivory); }
    .riga { display: flex; gap: .5em; flex-wrap: wrap; align-items: center; }
    .btn {
      font-family: var(--display); font-weight: 600; font-size: 1.05em; cursor: pointer;
      background: var(--gold); color: #1b1530; border: 0; border-radius: 999px; padding: .5em 1.2em;
    }
    .btn.secondario { background: transparent; color: var(--cream); border: 1px solid var(--line); }
    .btn:disabled { opacity: .5; cursor: default; }
    input.nome {
      font-family: var(--display); font-size: 1em; color: var(--ivory); background: var(--surface);
      border: 1px solid var(--line); border-radius: 999px; padding: .45em 1em; width: 11em; -webkit-user-select: text; user-select: text;
    }
    input.nome:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
    .gira { display: none; font-family: var(--mono); font-size: .8em; color: var(--gold); }
    .nota { font-family: var(--mono); font-size: .8em; color: var(--cream); min-height: 1.2em; }
    .classifica { font-family: var(--mono); font-size: .85em; }
    .classifica h3 { font-family: var(--display); font-size: 1.15em; color: var(--cream); margin-bottom: .3em; font-weight: 600; }
    .classifica ol { list-style: none; display: grid; gap: .15em; }
    .classifica li { display: flex; justify-content: space-between; gap: 1em; padding: .15em .6em; border-radius: 8px; background: rgba(255,255,255,.04); }
    .classifica li.io { background: rgba(228,179,60,.18); color: var(--gold); }
    .classifica li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 560px) {
      .pannello { grid-template-columns: 1fr; }
      .pannello .ritratto { display: none; }
      /* telefono in verticale: i pannelli prendono tutto lo schermo sotto la barra */
      .pannello { position: fixed; top: 49px; left: 0; right: 0; bottom: 0; border-radius: 0; background: rgba(13,13,12,.92); }
      #menu { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
      .poster { min-height: 0; }
      .logo { font-size: 17vw; bottom: 4%; }
      .pannello .testo { font-size: 15px; padding-bottom: 24px; }
      .gira { display: block !important; }
      .pannello .testo { padding: 4% 6%; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../../">← GoGoBar</a>
    <h1>Corri <span>Marf!</span></h1>
    <button id="audio" type="button">♪ on</button>
  </div>
  <div class="stage">
    <div class="schermo" id="schermo">
      <canvas id="c" aria-label="Corri Marf, il gioco"></canvas>

      <div class="pannello" id="menu">
        <div class="poster">
          <img src="marf.webp" alt="Marf che corre">
          <div class="logo" aria-hidden="true"><span class="uno">Corri</span><span class="due">Marf!!</span></div>
        </div>
        <div class="testo">
          <p class="sotto">Le femmine lo vogliono. Lui scappa.</p>
          <p class="gira">↻ Gira il telefono in orizzontale per giocare meglio</p>
          <div class="riga">
            <input class="nome" id="nomeMenu" maxlength="20" placeholder="Il tuo nome" autocomplete="nickname">
            <button class="btn" id="gioca" type="button">Corri!</button>
          </div>
          <div class="classifica" id="classificaMenu"></div>
        </div>
      </div>

      <div class="pannello" id="fine" hidden>
        <div class="ritratto"></div>
        <div class="testo">
          <h2>Ti hanno preso!</h2>
          <p class="sotto" id="risultato"></p>
          <div class="riga">
            <input class="nome" id="nomeFine" maxlength="20" placeholder="Il tuo nome" autocomplete="nickname">
            <button class="btn secondario" id="salva" type="button">Salva in classifica</button>
          </div>
          <p class="nota" id="nota"></p>
          <div class="riga"><button class="btn" id="riprova" type="button">Riprova</button></div>
          <div class="classifica" id="classificaFine"></div>
        </div>
      </div>
    </div>
  </div>
  <p class="hint">Salta: spazio, ↑ o tocca lo schermo (anche due volte) · Scivola: ↓ o swipe in giù</p>
  <audio id="musica" src="musica.mp3" loop preload="auto"></audio>

<script src="classifica.js?v=1" onerror="window.CorriMarfClassifica = null"></script>
<script>
(function () {
  'use strict';

  /* ── Mondo logico: 960 × 420, scalato per stare nello schermo ── */
  var W = 960, H = 420, TERRA = 360;   // TERRA = dove poggiano i piedi, sul marciapiede
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var scala = 1;

  function adatta() {
    var box = cv.parentElement.parentElement.getBoundingClientRect();
    var s = Math.min((box.width - 24) / W, (box.height - 24) / H);
    var dpr = window.devicePixelRatio || 1;
    cv.style.width = Math.floor(W * s) + 'px';
    cv.style.height = Math.floor(H * s) + 'px';
    cv.width = Math.floor(W * s * dpr);
    cv.height = Math.floor(H * s * dpr);
    scala = s * dpr;
  }
  window.addEventListener('resize', adatta);
  adatta();

  /* ── Salvataggi locali ── */
  function leggi(k, def) { try { var v = localStorage.getItem('corriMarf.' + k); return v === null ? def : v; } catch (e) { return def; } }
  function scrivi(k, v) { try { localStorage.setItem('corriMarf.' + k, String(v)); } catch (e) {} }
  var record = +leggi('record', 0) || 0;

  /* ── Musica e suoni ── */
  var musica = document.getElementById('musica');
  musica.volume = 0.55;
  var audioOn = leggi('audio', '1') === '1', actx = null;
  var btnAudio = document.getElementById('audio');
  function aggiornaAudio() {
    btnAudio.textContent = audioOn ? '♪ on' : '♪ off';
    musica.muted = !audioOn;
  }
  aggiornaAudio();
  btnAudio.addEventListener('click', function () {
    audioOn = !audioOn; scrivi('audio', audioOn ? '1' : '0'); aggiornaAudio();
    if (audioOn && stato === 'gioco') avviaMusica();
  });
  function avviaMusica() { if (!audioOn) return; var p = musica.play(); if (p && p.catch) p.catch(function () {}); }
  function bip(freq, dur, tipo, vol) {
    if (!audioOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = tipo || 'square'; o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(freq * 1.6, t + dur);
      g.gain.setValueAtTime(vol || 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  /* ── Pannelli e classifica ── */
  var menu = document.getElementById('menu'), fine = document.getElementById('fine');
  var nomeMenu = document.getElementById('nomeMenu'), nomeFine = document.getElementById('nomeFine');
  var nota = document.getElementById('nota'), btnSalva = document.getElementById('salva');
  nomeMenu.value = nomeFine.value = leggi('nome', '');
  var API = window.CorriMarfClassifica;

  function prendiNome(input) {
    var n = input.value.trim().slice(0, 20);
    if (n) { scrivi('nome', n); nomeMenu.value = nomeFine.value = n; }
    return n;
  }

  function mostraClassifica(box) {
    box.innerHTML = '';
    var h = document.createElement('h3'); h.textContent = 'Classifica'; box.append(h);
    if (!API || !API.attiva) { box.append(testo('p', 'Record su questo telefono: ' + record + ' pt')); return; }
    var attesa = testo('p', 'Carico...'); box.append(attesa);
    API.carica(10).then(function (righe) {
      attesa.remove();
      if (!righe.length) { box.append(testo('p', 'Ancora nessuno. Il primo posto è tuo!')); return; }
      var io = (leggi('nome', '') || '').toLowerCase();
      var ol = document.createElement('ol');
      righe.forEach(function (r, i) {
        var li = document.createElement('li');
        if (io && r.nome.toLowerCase() === io) li.className = 'io';
        li.append(testo('span', (i + 1) + '. ' + r.nome), testo('span', r.punti.toLocaleString('it-IT') + ' pt'));
        ol.append(li);
      });
      box.append(ol);
    });
  }
  function testo(tag, t) { var e = document.createElement(tag); e.textContent = t; return e; }

  var salvato = false;
  function salva() {
    if (salvato || !g || !API || !API.attiva) return;
    var nome = prendiNome(nomeFine);
    if (!nome) { nota.textContent = 'Scrivi il tuo nome per entrare in classifica.'; nomeFine.focus(); return; }
    var punti = punteggio();
    btnSalva.disabled = true; nota.textContent = 'Salvo...';
    API.salva(nome, punti).then(function () {
      salvato = true; nota.textContent = 'Salvato! In classifica resta il tuo punteggio migliore.';
      mostraClassifica(document.getElementById('classificaFine'));
    }, function (e) {
      btnSalva.disabled = false; nota.textContent = (e && e.message) || 'Non sono riuscito a salvare, riprova.';
    });
  }
  btnSalva.addEventListener('click', salva);
  nomeFine.addEventListener('keydown', function (e) { if (e.key === 'Enter') salva(); });
  nomeMenu.addEventListener('keydown', function (e) { if (e.key === 'Enter') inizia(); });
  document.getElementById('gioca').addEventListener('click', inizia);
  document.getElementById('riprova').addEventListener('click', inizia);

  // aprendo la pagina con #prova le ragazze non ti prendono mai (utile per provare le animazioni)
  var PROVA = location.hash === '#prova';
  if (PROVA) window.corriMarfProva = { salta: function () { salta(); }, giu: function (v) { giu(v); }, stato: function () { return g; }, vai: function (m) { scorrimento = m * 40; g.metri = m; },
    metti: function (tipo, x, quante) { var o = { tipo: tipo, t: TIPI[tipo], x: x, w: TIPI[tipo].w, h: TIPI[tipo].h * (quante || 1), quante: quante || 1 }; g.ostacoli.push(o); return o; },
    jet: function () { g.prossimoJet = 0; } };

  /* ── Stato ── */
  var FRASI = ['MARF!', 'Aspettaaa!', 'Dove scappi?', 'Ti amo Marf!', 'Un bacino!', 'Marfiiino!', 'Torna qui!'];
  var stato = 'menu'; // menu | gioco | preso
  var g;

  function nuovaPartita() {
    scorrimento = 0;
    g = {
      t: 0, vel: 380, metri: 0, birre: 0, passi: 0,
      marf: { y: TERRA, vy: 0, salti: 0, giu: false, botta: 0 },
      distacco: 230,       // px tra la prima inseguitrice e Marf (solo scena: ti prendono al terzo colpo)
      ostacoli: [], birreA: [], prossimo: 1.2, prossimaBirra: 3,
      fumetto: null, prossimoFumetto: 1.5, scatto: 0, scuoti: 0,
      anim: nuovaAnim(), ragazze: [0, 1, 2].map(function (i) { return { fase: i * 0.37, posa: null }; }),
      fx: [], colpi: 0, scudo: 0,
      jets: [], fumo: [], jetAvviso: 0, prossimoJet: 700 + Math.random() * 500
    };
  }
  nuovaPartita();
  mostraClassifica(document.getElementById('classificaMenu'));

  function inizia() {
    if (stato === 'gioco') return;
    if (stato === 'menu') prendiNome(nomeMenu);
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    nuovaPartita(); stato = 'gioco'; salvato = false;
    menu.hidden = true; fine.hidden = true;
    musica.currentTime = 0; avviaMusica();
  }

  function preso() {
    stato = 'preso';
    var punti = punteggio(), nuovo = punti > record;
    if (nuovo) { record = punti; scrivi('record', record); }
    document.getElementById('risultato').textContent =
      Math.floor(g.metri) + ' m · ' + g.birre + ' canne · ' + punti.toLocaleString('it-IT') + ' punti' + (nuovo ? ' · nuovo record!' : '');
    nota.textContent = ''; btnSalva.disabled = false;
    btnSalva.hidden = !(API && API.attiva); nomeFine.hidden = btnSalva.hidden;
    mostraClassifica(document.getElementById('classificaFine'));
    setTimeout(function () {
      if (stato !== 'preso') return;
      fine.hidden = false;
      if (API && API.attiva && leggi('nome', '') && nuovo) salva(); // nome già noto: salva da solo il nuovo record
    }, 700);
    musica.pause();
    bip(300, 0.5, 'sawtooth', 0.07); setTimeout(function () { bip(150, 0.6, 'sawtooth', 0.07); }, 200);
  }

  /* ── Comandi ── */
  function salta() {
    if (stato !== 'gioco') return;
    var m = g.marf;
    if (m.salti < 2) {
      m.vy = m.salti === 0 ? -720 : -620; m.salti++; m.giu = false;
      bip(m.salti === 1 ? 420 : 560, 0.12);
      if (m.salti === 1) polvere(MARF_X - 4, TERRA, 5, 1);
      else g.anim.giro = 1;                       // secondo salto: capriola
    }
  }
  function giu(attivo) {
    if (stato !== 'gioco') return;
    var m = g.marf;
    if (attivo) {
      if (m.y < TERRA) m.vy = Math.max(m.vy, 900); // a terra in fretta
      if (!m.giu) bip(200, 0.1, 'sawtooth', 0.04);
    }
    m.giu = attivo;
  }

  function inCampo(e) { return e.target && /^(INPUT|BUTTON)$/.test(e.target.tagName); }
  window.addEventListener('keydown', function (e) {
    if (inCampo(e)) return;
    var su = e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW';
    if (su) {
      e.preventDefault();
      if (e.repeat) return;
      if (stato === 'gioco') salta(); else if (stato === 'menu' || !fine.hidden) inizia();
    }
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); giu(true); }
    else if (e.code === 'Enter' && stato !== 'gioco' && (stato === 'menu' || !fine.hidden)) inizia();
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'ArrowDown' || e.code === 'KeyS') giu(false);
  });

  var tocco = null;
  cv.addEventListener('touchstart', function (e) {
    e.preventDefault(); var p = e.changedTouches[0];
    tocco = { x: p.clientX, y: p.clientY, giu: false };
  }, { passive: false });
  cv.addEventListener('touchmove', function (e) {
    e.preventDefault(); if (!tocco) return; var p = e.changedTouches[0];
    if (!tocco.giu && p.clientY - tocco.y > 30) { tocco.giu = true; giu(true); }
  }, { passive: false });
  cv.addEventListener('touchend', function (e) {
    e.preventDefault(); if (!tocco) return;
    if (tocco.giu) giu(false); else salta();
    tocco = null;
  }, { passive: false });
  cv.addEventListener('mousedown', salta);

  document.addEventListener('visibilitychange', function () {
    ultimo = performance.now();
    if (document.hidden) musica.pause(); else if (stato === 'gioco') avviaMusica();
  });

  /* ── Generazione ostacoli ── */
  // basso = da saltare, alto = da scivolarci sotto
  // ogni tipo: immagine, misura disegnata (alta dh), hitbox (w × h) e, per quelli in aria, a che altezza stanno
  var TIPI = {
    ragazza:     { img: 'ragazza-a-terra', dh: 46, w: 96, h: 36 },
    durex:       { img: 'durex', dh: 26, w: 84, h: 26 },          // impilabili: h × quante
    transenna:   { img: 'transenna', dh: 68, w: 104, h: 62 },
    juve:        { img: 'juve', dh: 106, w: 28, h: 100 },
    lazio:       { img: 'lazio', dh: 106, w: 28, h: 100 },
    carabiniere: { img: 'carabiniere', dh: 110, w: 22, h: 104 },
    pesce:       { img: 'pesce-spada', dh: 56, w: 128, h: 40, aria: 88 },   // si passa sotto scivolando
    aygo:        { img: 'aygo', dh: 68, w: 112, h: 56, corre: 260 }       // ti viene incontro
  };
  function generaOstacolo() {
    var r = Math.random(), lvl = Math.min(g.metri / 1500, 1), tipo;
    if (g.metri > 400 && r < 0.07) tipo = 'aygo';
    else if (r < 0.25) tipo = 'ragazza';
    else if (r < 0.42) tipo = 'durex';
    else if (r < 0.56) tipo = 'transenna';
    else if (r < 0.70) tipo = Math.random() < 0.5 ? 'juve' : 'lazio';
    else if (r < 0.79) tipo = 'carabiniere';
    else tipo = 'pesce';
    var t = TIPI[tipo], o = { tipo: tipo, t: t, x: W + 40, w: t.w, h: t.h, quante: 1 };
    if (tipo === 'durex') { o.quante = 1 + (Math.random() < 0.4 + lvl * 0.3 ? 1 : 0) + (Math.random() < lvl * 0.45 ? 1 : 0); o.h = t.h * o.quante; }
    g.ostacoli.push(o);
    var base = 1.25 - lvl * 0.45;
    g.prossimo = base + Math.random() * 0.9 + (tipo === 'aygo' ? 0.5 : 0);
  }

  // evento raro: cinque jet in formazione a punta di freccia, si schivano solo scivolando sotto
  var JET_DH = 34, JET_POS = [               // [dx, altezza del centro sopra il marciapiede, colore del fumo]
    [0, 170, 'bianco'], [80, 124, 'rosso'], [160, 78, 'rosso'], [80, 216, 'verde'], [160, 262, 'verde']
  ];
  function lanciaJet() {
    JET_POS.forEach(function (p) { g.jets.push({ x: W + 60 + p[0], y: TERRA - p[1], fumo: p[2], preso: false }); });
    bip(180, 0.6, 'sawtooth', 0.05);
  }

  /* ── Aggiornamento ── */
  function aggiorna(dt) {
    g.t += dt;
    animaTutto(dt);
    if (stato !== 'gioco') return;
    var m = g.marf;

    g.vel = Math.min(380 + g.t * 9, 820) * (g.scatto > 0 ? 1.15 : 1);

      if (a.giro > 0) target = mescola(target, P_PALLA, liscia(Math.min(1, a.giro * 2.2)), a.tmp2);
      verso(a.posa, target, dt, 14);
      a.ripresa = 0;
    } else {
      var freq = 1.45 + vel / 430;                      // passi più rapidi quando va veloce
      var fasePrima = a.fase;
      a.fase += dt * freq;
      target = posaCorsa(a.fase, 0.92 + Math.min(vel, 820) / 4000, a.tmp);
      if (a.atterra > 0) target = mescola(target, P_ATTERRA, liscia(a.atterra), a.tmp2);
      if (m.botta > 0.75) {                             // inciampo appena preso l'ostacolo
        var b = liscia((m.botta - 0.75) / 0.35);
        target.lean += 0.45 * b; target.head -= 0.3 * b;
        target.bA += Math.sin(g.t * 38) * 0.9 * b; target.bB += Math.cos(g.t * 33) * 0.9 * b;
      }
      verso(a.posa, target, dt, 10 + 32 * a.ripresa);
      // polvere a ogni appoggio
      if (inGioco && a.scivola < .2 && Math.floor(fasePrima * 2) !== Math.floor(a.fase * 2)) polvere(MARF_X + 6, TERRA, 2, .5);
    }
    a.atterra = Math.max(0, a.atterra - dt * 5.5);
    if (a.giro > 0) a.giro = Math.max(0, a.giro - dt * 1.9);

    // scivolata: il corpo si stende piano piano e si rialza piano piano
    var vuoleScivolare = inGioco && m.giu && aTerra;
    a.scivola += ((vuoleScivolare ? 1 : 0) - a.scivola) * (1 - Math.exp(-dt * (vuoleScivolare ? 16 : 10)));
    if (a.scivola > 0.02) {
      mescola(a.posa, P_SCIVOLA, liscia(a.scivola), a.mostra || (a.mostra = {}));
      if (vuoleScivolare && Math.random() < dt * 30) polvere(MARF_X + 34, TERRA, 1, .9);
    } else a.mostra = null;

    // anca: a terra la decide il piede d'appoggio, in aria resta all'altezza da in piedi
    var po = a.mostra || a.posa;
    var ancaVoluta = aTerra || !inGioco ? altezzaAnca(R, a.posa) : -R.gamba * R.K * 0.97;
    ancaVoluta += (-R.gamba * R.K * 0.08 - ancaVoluta) * liscia(a.scivola);   // in scivolata l'anca va giù
    if (a.anca === null) a.anca = ancaVoluta;
    a.anca += (ancaVoluta - a.anca) * (1 - Math.exp(-dt * (aTerra ? 30 : 12)));
  }

  function marfNuovo() {
    var a = g.anim, m = g.marf, R = PEZZI;
    if (a.anca === null) return;
    var po = a.mostra || a.posa;
    ctx.save();
    if (m.botta > 0) ctx.globalAlpha = Math.floor(m.botta * 12) % 2 === 0 ? 0.35 : 1;  // lampeggia dopo una botta
    ctx.translate(MARF_X, m.y);
    if (a.giro > 0) {                                    // capriola del doppio salto, attorno alla pancia
      var cy = a.anca * 1.35, giro = (1 - Math.pow(a.giro, 1.6)) * TAU;
      ctx.translate(0, cy); ctx.rotate(giro); ctx.translate(0, -cy);
    }
    if (a.scivola > 0.02) {                              // scivolata: ruota all'indietro attorno all'anca
      ctx.translate(-6 * a.scivola, a.anca); ctx.rotate(ROT_SCIVOLA * liscia(a.scivola)); ctx.translate(0, -a.anca);
    }
    personaggio(R, a.anca, po);
    ctx.restore();
  }

  /* ── Linee di velocità dello scatto (dopo una birra): tratti bianchi stile manga
     che partono dal corpo di Marf e volano indietro assottigliandosi ── */
  function aggiornaLinee(dt) {
    if (!g.linee) g.linee = [];
    var m = g.marf;
    if (stato === 'gioco' && g.scatto > 0) {
      var quante = dt * 70 * Math.min(1, g.scatto * 2);
      while (quante > 0) {
        if (Math.random() < quante) {
          var vicino = Math.random() < 0.55; // metà attorno a Marf, metà su tutto lo schermo
          g.linee.push({
            x: vicino ? MARF_X + 20 + Math.random() * 60 : W + Math.random() * 80,
            y: vicino ? m.y - 6 - Math.random() * 96 : 80 + Math.random() * (TERRA - 70),
            len: vicino ? 60 + Math.random() * 110 : 160 + Math.random() * 260,
            v: 1300 + Math.random() * 900,
            spess: 1.5 + Math.random() * 2.5, vita: vicino ? 0.25 + Math.random() * 0.15 : 0.5 + Math.random() * 0.3, t: 0
          });
        }
        quante -= 1;
      }
    }
    for (var i = g.linee.length - 1; i >= 0; i--) {
      var l = g.linee[i]; l.t += dt; l.x -= l.v * dt;
      if (l.t >= l.vita || l.x + l.len < -20) g.linee.splice(i, 1);
    }
  }
  // le scie e il bagliore sono disegnati una volta sola su canvas piccoli e poi solo copiati:
  // creare gradienti nuovi per ogni scia a ogni frame faceva calare gli fps durante lo scatto
  var SCIA = (function () {
    var c = document.createElement('canvas'); c.width = 256; c.height = 16;
    var x = c.getContext('2d');
    var gs = x.createLinearGradient(0, 0, 256, 0);
    gs.addColorStop(0, 'rgba(27,21,48,.45)'); gs.addColorStop(1, 'rgba(27,21,48,0)');
    x.fillStyle = gs; x.fillRect(0, 5, 256, 8);
    var gr = x.createLinearGradient(0, 0, 256, 0);
    gr.addColorStop(0, '#fff'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = gr; x.fillRect(0, 5, 256, 5);
    return c;
  })();
  var BAGLIORE = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 160;
    var x = c.getContext('2d'), r = x.createRadialGradient(80, 80, 5, 80, 80, 80);
    r.addColorStop(0, 'rgba(246,215,122,1)'); r.addColorStop(1, 'rgba(246,215,122,0)');
    x.fillStyle = r; x.fillRect(0, 0, 160, 160);
    return c;
  })();
  function disegnaLinee() {
    if (!g.linee) return;
    if (g.scatto > 0 && stato === 'gioco') {   // bagliore dorato attorno a Marf mentre lo scatto dura
      ctx.globalAlpha = 0.28 * Math.min(1, g.scatto * 2);
      ctx.drawImage(BAGLIORE, MARF_X - 80, g.marf.y - 135, 160, 160);
    }
    for (var i = 0; i < g.linee.length; i++) {
      var l = g.linee[i], u = l.t / l.vita;
      ctx.globalAlpha = Math.sin(Math.PI * Math.min(1, u * 1.4)) * 0.85;
      var h = (l.spess * (1 - u * 0.5) + 2.5) * 1.6;
      ctx.drawImage(SCIA, l.x, l.y - h * 0.4, l.len, h);
    }
    ctx.globalAlpha = 1;
  }

  // ragazze: stessa corsa, un po' più saltellante, col braccio che cerca di afferrare Marf
  function animaRagazze(dt) {
    var R = RIG.ragazza;
    if (!R || !R.pronto || !g.ragazze) return;
    var vel = stato === 'gioco' ? g.vel : 380;
    g.ragazze.forEach(function (r, i) {
      if (stato !== 'preso') r.fase += dt * (1.5 + vel / 430) * (1 + i * 0.03);
      var t = posaCorsa(r.fase, 1, r.tmp || (r.tmp = {}));
      var afferra = Math.sin(g.t * 6 + i * 2);
      t.bA = 1.3 + 0.22 * afferra; t.gA = t.bA + 0.25 + 0.2 * Math.max(0, -afferra);
      t.lean = 0.22 + (t.lean - 0.17);
      if (!r.posa) r.posa = mescola(t, t, 0);
      verso(r.posa, t, dt, 30);
      r.anca = altezzaAnca(R, r.posa);
    });
  }

  // polvere: nuvolette che restano indietro mentre il mondo scorre
  function polvere(x, y, n, forza) {
    if (!g) return;
    for (var i = 0; i < n; i++) {
      g.fx.push({ x: x + (Math.random() - .5) * 10, y: y - Math.random() * 3,
        vx: -(30 + Math.random() * 90) * forza, vy: -(20 + Math.random() * 70) * forza,
        r: 2.5 + Math.random() * 3.5 * forza, vita: 0.35 + Math.random() * 0.35, t: 0 });
    }
    if (g.fx.length > 80) g.fx.splice(0, g.fx.length - 80);
  }
  function aggiornaPolvere(dt) {
    var scorre = stato === 'gioco' ? g.vel : 0;
    for (var i = g.fx.length - 1; i >= 0; i--) {
      var p = g.fx[i];
      p.t += dt; if (p.t >= p.vita) { g.fx.splice(i, 1); continue; }
      p.x += (p.vx - scorre * 0.6) * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.vx *= 1 - dt * 3;
      if (p.y > TERRA) { p.y = TERRA; p.vy = 0; }
    }
  }
  function disegnaPolvere() {
    if (!g.fx) return;
    g.fx.forEach(function (p) {
      var u = p.t / p.vita;
      ctx.fillStyle = 'rgba(241,239,233,' + (0.38 * (1 - u)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + u * 1.2), 0, TAU); ctx.fill();
    });
  }
  var GAMBA_TOT = PEZZI.gamba, K = PEZZI.K;

  function gamba(x, y, ang) {
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x + Math.sin(ang) * 36, y + Math.cos(ang) * 36); ctx.stroke();
  }

  // Le tre inseguitrici: per ora la stessa ragazza ripetuta (poi ne arrivano altre)
  var RAGAZZE = [
    { capelli: '#f2c94c', vestito: '#e05d8c', rig: 'ragazza', scala: 1 },
    { capelli: '#3b2a1c', vestito: '#9b5de5', rig: 'ragazza', scala: 0.96 },
    { capelli: '#c0392b', vestito: '#e4b33c', rig: 'ragazza', scala: 1.03 }
  ];
  function inseguitrici() {
    if (stato === 'menu') return;
    var fronte = MARF_X - 30 - Math.max(g.distacco, 0);
    var fase = g.t * 14;
    for (var i = RAGAZZE.length - 1; i >= 0; i--) {
      var r = RAGAZZE[i], R = RIG[r.rig];
      var x = fronte - i * 46, y = TERRA - Math.abs(Math.sin(fase + i)) * 4;
      if (x < -60) continue;
      ctx.save(); ctx.translate(x, y);
      if (R && R.pronto && g.ragazze && g.ragazze[i].posa) {
        var gr = g.ragazze[i];
        ctx.translate(0, TERRA - y);                    // il rimbalzo lo fa già lo scheletro
        ctx.scale(r.scala, r.scala);
        personaggio(R, gr.anca, gr.posa);
        ctx.fillStyle = '#ff5c8a'; cuore(16, -112 - Math.abs(Math.sin(fase * 0.5 + i)) * 10, 7);
      } else {
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#e8b98f'; ctx.lineWidth = 7;
        var a = Math.sin(fase + i * 1.3) * 0.8;
        gamba(-3, -30, a); gamba(3, -30, -a);
        ctx.fillStyle = r.vestito;
        ctx.beginPath(); ctx.moveTo(-18, -30); ctx.lineTo(18, -30); ctx.lineTo(10, -70); ctx.lineTo(-10, -70); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#e8b98f'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(6, -64); ctx.lineTo(30, -76 + Math.sin(fase + i) * 6); ctx.stroke();
        ctx.fillStyle = r.capelli; ctx.beginPath(); ctx.arc(-4, -86, 21, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(-24, -88, 14, 34);
        ctx.fillStyle = '#e8b98f'; ctx.beginPath(); ctx.arc(2, -86, 16, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(8, -89, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#d2452f'; ctx.beginPath(); ctx.arc(11, -79, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff5c8a'; cuore(14, -112 - Math.abs(Math.sin(fase * 0.5 + i)) * 10, 7);
      }
      ctx.restore();
      if (g.fumetto && g.fumetto.chi === i && stato === 'gioco') fumetto(x, y - 120, g.fumetto.testo);
    }
  }
  function cuore(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
    ctx.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.6, y - s * 1.4, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.6, y - s * 1.4, x + s * 1.6, y - s * 0.2, x, y + s * 0.9);
    ctx.fill();
  }
  function fumetto(x, y, testo) {
    ctx.font = '600 16px Fredoka, sans-serif';
    var w = ctx.measureText(testo).width + 20;
    var bx = Math.max(8, x - w / 2);
    ctx.fillStyle = '#fff6dc'; roundRect(bx, y - 30, w, 28, 12); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 4, y - 3); ctx.lineTo(x + 8, y - 3); ctx.lineTo(x, y + 8); ctx.fill();
    ctx.fillStyle = '#1b1530'; ctx.textAlign = 'left'; ctx.fillText(testo, bx + 10, y - 10);
  }

  function cuore(x, y, colore) {
    ctx.fillStyle = colore; ctx.beginPath();
    ctx.moveTo(x, y + 7); ctx.bezierCurveTo(x - 13, y - 2, x - 6, y - 12, x, y - 5);
    ctx.bezierCurveTo(x + 6, y - 12, x + 13, y - 2, x, y + 7); ctx.fill();
  }
  function hud() {
    ctx.save(); ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(27,21,48,.55)'; roundRect(10, 12, 236, 62, 14); ctx.fill();
    roundRect(W - 232, 12, 222, 62, 14); ctx.fill();
    ctx.fillStyle = '#f4efe2'; ctx.font = '700 28px Fredoka, sans-serif';
    ctx.fillText(Math.floor(g.metri) + ' m', 20, 40);
    ctx.font = '500 15px "DM Mono", monospace'; ctx.fillStyle = '#e8e1cc';
    if (pronta(OGG.canna)) ctx.drawImage(cache(OGG.canna, 26, 20), 18, 49, 26, 20);
    ctx.fillText(g.birre + (g.birre === 1 ? ' canna' : ' canne') + ' · record ' + record, 50, 64);
    var p = 1 - Math.max(g.distacco, 0) / 260;
    ctx.fillStyle = 'rgba(255,255,255,.18)'; roundRect(W - 220, 24, 196, 14, 7); ctx.fill();
    ctx.fillStyle = p > 0.7 ? '#d2452f' : '#ff5c8a'; roundRect(W - 220, 24, Math.max(196 * p, 14), 14, 7); ctx.fill();
    // vite: al terzo colpo ti prendono
    for (var v = 0; v < 3; v++) cuore(W - 36 - v * 26, 58, 3 - g.colpi > 2 - v ? '#ff5c8a' : 'rgba(255,255,255,.22)');
    ctx.fillStyle = '#e8e1cc'; ctx.textAlign = 'left';
    ctx.fillText(g.scudo > 0 ? 'scudo ' + Math.ceil(g.scudo) + 's' : 'vite', W - 220, 64);
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  /* ── Ciclo ── */
  var ultimo = performance.now();
  function ciclo(ora) {
    var dt = Math.min((ora - ultimo) / 1000, 1 / 20);
    ultimo = ora;
    aggiorna(dt);
    disegna();
    requestAnimationFrame(ciclo);
  }
  requestAnimationFrame(ciclo);
})();
</script>
</body>
