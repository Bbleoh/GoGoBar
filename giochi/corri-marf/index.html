<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Corri Marf! · GoGoBar</title>
  <meta name="description" content="Marf corre e scappa dalle femmine. Quanto lontano arrivi?">
  <meta property="og:title" content="Corri Marf!">
  <meta property="og:description" content="Marf corre e scappa dalle femmine. Quanto lontano arrivi?">
  <meta property="og:image" content="copertina.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #09090b; --surface: #131317; --line: #26262d; --ivory: #f4efe2; --cream: #b9b4a6;
      --muted: #6c6a73; --gold: #e4b33c; --red: #d2452f; --pink: #ff5c8a; --ink: #121216;
      --display: 'Chakra Petch', sans-serif; --mono: 'DM Mono', monospace;
      --taglio: 12px;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--ivory); font-family: var(--display);
      display: flex; flex-direction: column; align-items: center;
      overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    .bar {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: .7rem 16px; border-bottom: 1px solid var(--line);
    }
    .bar a, .bar button { font-family: var(--mono); font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--cream); text-decoration: none; background: none; border: 0; cursor: pointer; }
    .bar a:hover, .bar button:hover { color: var(--gold); }
    .bar-dx { display: flex; gap: 1.1rem; }
    .bar button.radio-on { color: var(--gold); }
    .bar h1 { font-size: 1.2rem; font-weight: 700; font-style: italic; text-transform: uppercase; letter-spacing: .04em; }
    .bar h1 span { color: var(--gold); }
    .stage { position: relative; flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding: 12px; min-height: 0; }
    .schermo { position: relative; }
    canvas { display: block; border: 1px solid var(--line); background: #15131c;
      clip-path: polygon(var(--taglio) 0, 100% 0, 100% calc(100% - var(--taglio)), calc(100% - var(--taglio)) 100%, 0 100%, 0 var(--taglio)); }
    .hint { font-family: var(--mono); font-size: .68rem; color: var(--muted); padding: 0 16px 12px; text-align: center; letter-spacing: .08em; text-transform: uppercase; }

    /* pannelli sopra il gioco (menu e fine partita) */
    .pannello {
      position: absolute; inset: 0; overflow: hidden;
      clip-path: polygon(var(--taglio) 0, 100% 0, 100% calc(100% - var(--taglio)), calc(100% - var(--taglio)) 100%, 0 100%, 0 var(--taglio));
      background: linear-gradient(100deg, rgba(9,9,11,.35) 30%, rgba(9,9,11,.9) 62%); backdrop-filter: blur(2px);
      display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); align-items: center;
    }
    .pannello[hidden] { display: none; }
    .pannello .ritratto { height: 92%; align-self: end; background: url(marf.webp) center bottom / contain no-repeat; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }

    /* schermata d'avvio: Marf scontornato con il logo davanti */
    #menu { background: radial-gradient(ellipse at 30% 60%, rgba(228,179,60,.14), transparent 60%), linear-gradient(100deg, rgba(9,9,11,.2) 40%, rgba(9,9,11,.82) 70%); grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); }
    .poster { position: relative; height: 100%; }
    .poster img { position: absolute; left: 50%; bottom: -4%; height: 104%; transform: translateX(-50%); filter: drop-shadow(0 14px 24px rgba(0,0,0,.55)); animation: respiro 2.4s ease-in-out infinite; }
    @keyframes respiro { 50% { transform: translateX(-50%) translateY(-1.5%); } }
    .logo {
      position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%) rotate(-6deg) skewX(-8deg);
      text-align: center; line-height: .8; white-space: nowrap; pointer-events: none; text-transform: uppercase;
      font-family: var(--display); font-weight: 700; font-style: italic; font-size: clamp(30px, 7.4vw, 92px);
    }
    .logo span { display: block; -webkit-text-stroke: .06em var(--ink); paint-order: stroke fill; text-shadow: .05em .07em 0 var(--ink), 0 .16em .25em rgba(0,0,0,.45); }
    .logo .uno { font-size: .5em; color: var(--ivory); transform: translateX(-.7em); letter-spacing: .06em; }
    .logo .due { color: var(--gold); background: linear-gradient(180deg, #f6d77a 15%, #e4b33c 55%, #c98a1c); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .logo .due { filter: drop-shadow(.05em .07em 0 var(--ink)); text-shadow: none; }
    .pannello .testo { padding: 4% 6% 4% 2%; display: flex; flex-direction: column; gap: .75em; font-size: clamp(11px, 1.7vw, 17px); max-height: 100%; overflow: auto; }
    .pannello h2 { font-size: 2.6em; line-height: .95; color: var(--gold); font-style: italic; text-transform: uppercase; letter-spacing: .01em; }
    .pannello h2::after { content: ''; display: block; width: 2.2em; height: 4px; background: var(--pink); margin-top: .25em; transform: skewX(-30deg); }
    .pannello .sotto { font-size: 1.1em; color: var(--ivory); font-weight: 500; }
    .riga { display: flex; gap: .5em; flex-wrap: wrap; align-items: center; }
    .btn {
      --c: 9px;
      font-family: var(--display); font-weight: 700; font-style: italic; font-size: 1.05em; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
      background: var(--gold); color: var(--ink); border: 0; padding: .55em 1.5em;
      clip-path: polygon(var(--c) 0, 100% 0, calc(100% - var(--c)) 100%, 0 100%);
      transition: filter .15s, transform .15s;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.12); transform: translateX(2px); }
    .btn.secondario { background: var(--surface); color: var(--ivory); box-shadow: inset 0 0 0 1px var(--line); font-size: .9em; }
    .btn:disabled { opacity: .5; cursor: default; }
    input.nome {
      font-family: var(--display); font-weight: 600; font-size: 1em; color: var(--ivory); background: var(--surface);
      border: 0; border-bottom: 2px solid var(--line); border-radius: 0; padding: .45em .8em; width: 11em; -webkit-user-select: text; user-select: text;
    }
    input.nome::placeholder { color: var(--muted); }
    input.nome:focus { outline: 0; border-bottom-color: var(--gold); }
    .gira { display: none; font-family: var(--mono); font-size: .8em; color: var(--gold); }
    .nota { font-family: var(--mono); font-size: .8em; color: var(--cream); min-height: 1.2em; }
    .classifica { font-family: var(--mono); font-size: .82em; }
    .classifica h3 { font-family: var(--mono); font-size: .85em; color: var(--cream); margin-bottom: .5em; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; }
    .classifica ol { list-style: none; display: grid; gap: 2px; counter-reset: pos; }
    .classifica li { counter-increment: pos; display: flex; justify-content: space-between; gap: 1em; padding: .25em .7em .25em 0; background: rgba(255,255,255,.035); border-left: 2px solid var(--line); }
    .classifica li::before { content: counter(pos, decimal-leading-zero); color: var(--muted); width: 2.4em; text-align: center; flex: none; }
    .classifica li span:first-child { flex: 1; }
    .classifica li:first-child { border-left-color: var(--gold); }
    .classifica li.io { background: rgba(228,179,60,.14); color: var(--gold); border-left-color: var(--gold); }
    .classifica li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chi { font-family: var(--mono); font-size: .8em; color: var(--cream); letter-spacing: .06em; }
    .chi b { color: var(--gold); font-family: var(--display); font-size: 1.25em; font-style: italic; letter-spacing: .02em; }
    .giocatori { display: flex; flex-wrap: wrap; gap: 5px; max-height: 6.2em; overflow: auto; }
    .giocatore-chip {
      font-family: var(--display); font-weight: 600; font-size: .85em; cursor: pointer; color: var(--ivory);
      background: var(--surface); border: 0; box-shadow: inset 0 0 0 1px var(--line); padding: .3em .9em;
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); display: inline-flex; gap: .45em; align-items: baseline;
    }
    .giocatore-chip small { font-family: var(--mono); font-weight: 400; font-size: .8em; color: var(--muted); }
    .giocatore-chip:hover, .giocatore-chip:focus-visible { box-shadow: inset 0 0 0 1px var(--gold); outline: 0; }
    .giocatore-chip.attuale { background: rgba(228,179,60,.18); box-shadow: inset 0 0 0 1px var(--gold); color: var(--gold); }
    .nota:empty { display: none; }
    /* nastro dei consigli in fondo alla lobby */
    .consigli {
      position: absolute; left: 0; right: 0; bottom: 0; height: 30px; display: flex; align-items: center; overflow: hidden;
      background: rgba(9,9,11,.82); border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; letter-spacing: .04em;
    }
    .consigli b {
      flex: none; height: 100%; display: flex; align-items: center; padding: 0 18px 0 14px; position: relative; z-index: 1;
      background: var(--gold); color: var(--ink); font-family: var(--display); font-style: italic; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
      clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    }
    .nastro { flex: 1; overflow: hidden; white-space: nowrap; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
    .nastro span { display: inline-block; padding-left: 100%; color: var(--ivory); animation: nastro var(--durata, 90s) linear infinite; }
    .nastro span i { font-style: normal; color: var(--pink); margin: 0 1.2em; }
    @keyframes nastro { to { transform: translateX(-100%); } }
    #menu .testo { padding-bottom: 46px; }
    #menu:not([hidden]) ~ .fs-btn { bottom: 40px; }
    .fs-btn {
      position: absolute; right: 10px; bottom: 10px; z-index: 5; width: 38px; height: 38px; cursor: pointer;
      font-size: 20px; line-height: 1; color: var(--ivory); background: rgba(10,10,14,.62); border: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }
    .fs-btn:hover { color: var(--gold); }
    /* schermo intero: niente barra, il gioco prende tutto */
    body.fs .bar, body.fs .hint { display: none; }
    body.fs .stage { padding: 0; }
    body.fs canvas { border: 0; clip-path: none; }
    @media (max-width: 560px) {
      .pannello { grid-template-columns: 1fr; }
      .pannello .ritratto { display: none; }
      /* telefono in verticale: i pannelli prendono tutto lo schermo sotto la barra */
      .pannello { position: fixed; top: 49px; left: 0; right: 0; bottom: 0; clip-path: none; background: rgba(9,9,11,.93); }
      #menu { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
      .poster { min-height: 0; }
      .logo { font-size: 17vw; bottom: 4%; }
      .pannello .testo { font-size: 15px; padding-bottom: 24px; }
      .gira { display: block !important; }
      .pannello .testo { padding: 4% 6%; }
      .fs-btn { position: fixed; z-index: 30; right: 12px; bottom: 12px; }
    }
    /* telefono in verticale a schermo intero: giro il gioco di 90° così è orizzontale da solo */
    body.ruota .stage { position: fixed; top: 0; left: 0; transform-origin: 0 0; transform: translateX(100vw) rotate(90deg); }
    body.ruota .pannello { position: absolute; inset: 0; top: 0; clip-path: none; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); background: linear-gradient(100deg, rgba(9,9,11,.35) 30%, rgba(9,9,11,.9) 62%); }
    body.ruota #menu { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); grid-template-rows: none; }
    body.ruota .pannello .ritratto { display: block; }
    body.ruota .logo { font-size: 15vw; bottom: 7%; }
    body.ruota .pannello .testo { font-size: 12px; padding: 3% 4% 3% 1%; }
    body.ruota .gira { display: none !important; }
    body.ruota .fs-btn { position: absolute; right: 10px; bottom: 10px; }
  </style>
</head>
<body>
  <div class="bar">
    <a href="../../">← GoGoBar</a>
    <h1>Corri <span>Marf!</span></h1>
    <span class="bar-dx"><button type="button" data-gogobar-radio title="Radio GoGoBar: i brani della sezione Musica">📻 radio</button><button id="audio" type="button">♪ on</button></span>
  </div>
  <div class="stage">
    <div class="schermo" id="schermo">
      <canvas id="c" aria-label="Corri Marf, il gioco"></canvas>

      <div class="pannello" id="menu">
        <div class="poster">
          <img src="marf.webp" alt="Marf che corre">
          <div class="logo" aria-hidden="true"><span class="uno">Corri</span><span class="due">Marf!!</span></div>
        </div>
        <div class="testo">
          <p class="sotto">Le femmine lo vogliono. Lui scappa.</p>
          <p class="gira">Tocca ⛶ in basso a destra per giocare a schermo intero, in orizzontale</p>
          <p class="chi" id="chiCorre"></p>
          <div class="giocatori" id="giocatori" hidden></div>
          <div class="riga">
            <input class="nome" id="nomeMenu" maxlength="20" placeholder="Nuovo nome" autocomplete="nickname">
            <button class="btn" id="gioca" type="button">Corri!</button>
          </div>
          <p class="nota" id="notaMenu"></p>
          <div class="classifica" id="classificaMenu"></div>
        </div>
        <div class="consigli" aria-label="Consigli"><b>Consigli</b><div class="nastro"><span id="nastro"></span></div></div>
      </div>

      <div class="pannello" id="fine" hidden>
        <div class="ritratto"></div>
        <div class="testo">
          <h2>Ti hanno preso!</h2>
          <p class="sotto" id="risultato"></p>
          <p class="nota" id="nota"></p>
          <div class="riga">
            <button class="btn" id="riprova" type="button">Riprova</button>
            <button class="btn secondario" id="salva" type="button" hidden>Riprova a salvare</button>
            <button class="btn secondario" id="cambia" type="button">Cambia giocatore</button>
          </div>
          <div class="classifica" id="classificaFine"></div>
        </div>
      </div>
      <button class="fs-btn" id="schermoIntero" type="button" aria-label="Schermo intero" title="Schermo intero">⛶</button>
    </div>
  </div>
  <p class="hint">Salta: spazio, ↑ o tocca lo schermo (anche due volte) · Scivola: ↓ o swipe in giù</p>
  <audio id="musica" src="musica.mp3" loop preload="auto"></audio>
  <audio id="musicaLobby" data-musica src="musica-lobby.mp3" loop preload="auto"></audio>
  <audio id="musicaMorte" data-musica src="musica-morte.mp3" loop preload="none"></audio>

<script src="classifica.js?v=2" onerror="window.CorriMarfClassifica = null"></script>
<script>
(function () {
  'use strict';

  /* ── Mondo logico: 960 × 420, scalato per stare nello schermo ── */
  var W = 960, H = 420, TERRA = 360;   // TERRA = dove poggiano i piedi, sul marciapiede
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var scala = 1;

  var stage = cv.parentElement.parentElement;
  function adatta() {
    var ruota = document.body.classList.contains('fs') && innerHeight > innerWidth;
    document.body.classList.toggle('ruota', ruota);
    stage.style.width = ruota ? innerHeight + 'px' : '';
    stage.style.height = ruota ? innerWidth + 'px' : '';
    var pad = document.body.classList.contains('fs') ? 0 : 24;
    var s = Math.min((stage.clientWidth - pad) / W, (stage.clientHeight - pad) / H);
    var dpr = window.devicePixelRatio || 1;
    cv.style.width = Math.floor(W * s) + 'px';
    cv.style.height = Math.floor(H * s) + 'px';
    cv.width = Math.floor(W * s * dpr);
    cv.height = Math.floor(H * s * dpr);
    scala = s * dpr;
  }
  window.addEventListener('resize', adatta);
  adatta();

  /* ── Salvataggi locali ── */
  function leggi(k, def) { try { var v = localStorage.getItem('corriMarf.' + k); return v === null ? def : v; } catch (e) { return def; } }
  function scrivi(k, v) { try { localStorage.setItem('corriMarf.' + k, String(v)); } catch (e) {} }
  /* ── Giocatori: il nome è l'account (come nella Bisca) ──
     corriMarf.giocatori = { chiave: { nome, record } } su questo browser; online i record stanno in classifica */
  var NOME_OK = /^[\wÀ-ÿ _\-]+$/;
  function chiaveNome(n) { return String(n || '').trim().toLowerCase(); }
  function giocatori() { try { var x = JSON.parse(leggi('giocatori', '{}')); return x && typeof x === 'object' ? x : {}; } catch (e) { return {}; } }
  function salvaGiocatori(x) { scrivi('giocatori', JSON.stringify(x)); }
  var giocatore = leggi('nome', '');
  (function () {                       // migra il vecchio record unico sul nome salvato
    var vecchio = +leggi('record', 0) || 0, tutti = giocatori();
    if (giocatore && !tutti[chiaveNome(giocatore)]) { tutti[chiaveNome(giocatore)] = { nome: giocatore, record: vecchio }; salvaGiocatori(tutti); }
  })();
  function recordDi(nome) { var a = giocatori()[chiaveNome(nome)]; return a ? +a.record || 0 : 0; }
  var record = giocatore ? recordDi(giocatore) : 0;

  /* ── Musica e suoni ── */
  // tre musiche: lobby (menu), corsa, morte (schermata finale); ne suona una alla volta
  var musica = document.getElementById('musica');
  var TRACCE = { gioco: musica, lobby: document.getElementById('musicaLobby'), morte: document.getElementById('musicaMorte') };
  Object.keys(TRACCE).forEach(function (k) { TRACCE[k].volume = 0.55; });
  var traccia = 'lobby';
  function suona(nome) {
    Object.keys(TRACCE).forEach(function (k) { if (k !== nome) TRACCE[k].pause(); });
    if (traccia !== nome) { traccia = nome; try { TRACCE[nome].currentTime = 0; } catch (e) {} }
    avviaMusica();
  }
  var audioOn = leggi('audio', '1') === '1', actx = null;
  var btnAudio = document.getElementById('audio');
  function aggiornaAudio() {
    btnAudio.textContent = audioOn ? '♪ on' : '♪ off';
    Object.keys(TRACCE).forEach(function (k) { TRACCE[k].muted = !audioOn; });
  }
  aggiornaAudio();
  btnAudio.addEventListener('click', function () {
    audioOn = !audioOn; scrivi('audio', audioOn ? '1' : '0'); aggiornaAudio();
    if (audioOn) avviaMusica();
  });
  function avviaMusica() { if (!audioOn) return; var p = TRACCE[traccia].play(); if (p && p.catch) p.catch(function () {}); }
  // il browser non fa partire l'audio da solo: la musica della lobby parte al primo tocco o tasto
  function primoGesto() {
    window.removeEventListener('pointerdown', primoGesto, true); window.removeEventListener('keydown', primoGesto, true);
    if (TRACCE[traccia].paused) avviaMusica();
  }
  window.addEventListener('pointerdown', primoGesto, true); window.addEventListener('keydown', primoGesto, true);
  function bip(freq, dur, tipo, vol) {
    if (!audioOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = tipo || 'square'; o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(freq * 1.6, t + dur);
      g.gain.setValueAtTime(vol || 0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

  // i font del canvas vanno caricati a mano (il DOM non li usa tutti)
  if (document.fonts && document.fonts.load) ['italic 700 32px "Chakra Petch"', '600 13px "Chakra Petch"', '500 13px "DM Mono"']
    .forEach(function (f) { document.fonts.load(f).catch(function () {}); });

  /* ── Pannelli, giocatori e classifica ── */
  var menu = document.getElementById('menu'), fine = document.getElementById('fine');
  var nomeMenu = document.getElementById('nomeMenu'), notaMenu = document.getElementById('notaMenu');
  var nota = document.getElementById('nota'), btnSalva = document.getElementById('salva');
  var API = window.CorriMarfClassifica;
  var online = {};                     // chiave → { nome, punti } dalla classifica

  function scegli(nome, punti) {
    var tutti = giocatori(), k = chiaveNome(nome), a = tutti[k] || { nome: nome, record: 0 };
    if (API && API.letta) {            // la classifica online comanda: se lì il record non c'è (o è stato tolto), riparte da 0
      a.record = online[k] ? online[k].punti : 0;
      if (online[k]) a.nome = online[k].nome;
    }
    if (punti) a.record = Math.max(+a.record || 0, punti);
    tutti[k] = a; salvaGiocatori(tutti);
    giocatore = a.nome; record = +a.record || 0; scrivi('nome', giocatore);
    aggiornaChi();
  }
  function aggiornaChi() {
    var chi = document.getElementById('chiCorre');
    chi.textContent = '';
    if (giocatore) { chi.append('Corre '); chi.append(testo('b', giocatore)); chi.append(' · record ' + record.toLocaleString('it-IT') + ' pt'); }
    else chi.textContent = 'Chi corre? Scegli il tuo nome o scrivine uno nuovo.';
    document.getElementById('cambia').hidden = false;
    disegnaGiocatori();
  }
  function disegnaGiocatori() {
    var box = document.getElementById('giocatori'), tutti = {}, loc = giocatori();
    var letta = API && API.letta;
    Object.keys(loc).forEach(function (k) { tutti[k] = { nome: loc[k].nome || k, punti: letta ? 0 : +loc[k].record || 0 }; });

  var TIPI = {
    ragazza:     { img: 'ragazza-a-terra', dh: 46, w: 96, h: 36 },
    durex:       { img: 'durex', dh: 26, w: 84, h: 26 },          // impilabili: h × quante

  function generaOstacolo() {

    var r = Math.random(), lvl = Math.min(g.metri / 1500, 1), tipo;
    if (g.metri > 400 && r < 0.07) tipo = 'aygo';

    else if (r < 0.42) tipo = 'durex';
    else if (r < 0.56) tipo = 'transenna';

  /* ── Aggiornamento ── */
  function aggiorna(dt) {

    var m = g.marf;

    g.vel = Math.min(380 + g.t * 9, 820) * (g.scatto > 0 ? 1.15 : 1);
    var dx = g.vel * dt;
    g.metri += dx / 40;

    g.passi += dt * (7 + g.vel / 90);

    // fisica di Marf
    m.vy += 2100 * dt;
    m.y += m.vy * dt;
    var suolo = palazzo && palazzo.dentro ? palazzo.pav : TERRA;   // dentro il corridoio il pavimento è quello del palazzo
    m.aTerra = m.y >= suolo;

    if (g.metri > g.prossimoJet && g.jetAvviso <= 0 && !g.jets.length && !zonaPalazzo() && g.metri < g.prossimoPalazzo - 120) {

      if (j.x + jw < -40) { g.jets.splice(k, 1); continue; }
      var bj = { x: j.x + 6, y: j.y - 13, w: jw - 14, h: 26 };

    ctx.restore();

  /* ── Animazione ──────────────────────────────────────────────────────────
     Come nei cutout animati: ogni movimento è fatto di pose chiave
     (contatto, carico, spinta, stacco, ritorno, passaggio, slancio per la corsa)
     interpolate con curve morbide (Catmull-Rom). Fra uno stato e l'altro
     (corsa, salto, atterraggio, scivolata) la posa non salta: ogni giuntura
     insegue quella nuova con una molla, quindi i passaggi sono sempre fluidi.

  var TAU = Math.PI * 2;
  var CHIAVI = ['cA', 'sA', 'fA', 'cB', 'sB', 'fB', 'bA', 'gA', 'bB', 'gB', 'lean', 'head'];

    var a = k[i], b = k[(i + 1) % n];

  }

  // Ciclo di corsa di una gamba (0 = il tallone tocca terra davanti).
  // coscia e piede sono angoli assoluti, ginocchio è relativo alla coscia (negativo = piegato).
  var CORSA = {
    coscia:    [[0, .55], [.12, .32], [.3, -.18], [.45, -.52], [.62, -.32], [.8, .58], [.92, .76]],
    ginocchio: [[0, -.12], [.12, -.55], [.3, -.28], [.45, -.32], [.62, -1.85], [.8, -1.6], [.92, -.45]],
    piede:     [[0, .3], [.12, 0], [.3, -.04], [.45, -.7], [.62, -.85], [.8, -.35], [.92, .15]],
    // braccio dello stesso lato: va indietro quando la gamba va avanti
    omero:     [[0, -.72], [.25, -.05], [.5, .8], [.75, .05]],
    gomito:    [[0, 1.2], [.25, 1.45], [.5, 1.9], [.75, 1.5]]

  var P_SALITA = { cA: 1.25, sA: -.35, fA: -.3, cB: -.45, sB: -1.55, fB: -.9, bA: 2.5, gA: 2.75, bB: -.95, gB: -.45, lean: .2, head: -.05 };

  // quanto scende il punto più basso del piede (in unità del mondo), per tenere il piede a terra

  function animaTutto(dt) {

  function animaMarf(dt) {

  /* ── Ragdoll quando ti prendono: Marf viene sbalzato, ruota, rimbalza e gli arti vanno a peso morto.

  function avviaRagdoll() {

    var v = {}; CHIAVI.forEach(function (k) { v[k] = (Math.random() - .5) * 14; });

  function aggiornaRagdoll(dt) {

  function marfNuovo() {
    var a = g.anim, m = g.marf, R = PEZZI;
    if (a.anca === null) return;

            y: vicino ? m.y - 6 - Math.random() * 96 : 80 + Math.random() * (TERRA - 70),

  // le scie e il bagliore sono disegnati una volta sola su canvas piccoli e poi solo copiati:

  // polvere: nuvolette che restano indietro mentre il mondo scorre

      var p = g.fx[i];
      p.t += dt; if (p.t >= p.vita) { g.fx.splice(i, 1); continue; }
      p.x += (p.vx - scorre * 0.6) * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.vx *= 1 - dt * 3;
      if (p.y > TERRA) { p.y = TERRA; p.vy = 0; }
    }
  }
  function disegnaPolvere() {
    if (!g.fx) return;
    g.fx.forEach(function (p) {
      var u = p.t / p.vita;
      ctx.fillStyle = 'rgba(241,239,233,' + (0.38 * (1 - u)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + u * 1.2), 0, TAU); ctx.fill();
    });
  }
  var GAMBA_TOT = PEZZI.gamba, K = PEZZI.K;

  function gamba(x, y, ang) {
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x + Math.sin(ang) * 36, y + Math.cos(ang) * 36); ctx.stroke();
  }

  // Le tre inseguitrici: per ora la stessa ragazza ripetuta (poi ne arrivano altre)
  var RAGAZZE = [
    { capelli: '#f2c94c', vestito: '#e05d8c', rig: 'ragazza', scala: 1 },
    { capelli: '#3b2a1c', vestito: '#9b5de5', rig: 'ragazza', scala: 0.96 },
    { capelli: '#c0392b', vestito: '#e4b33c', rig: 'ragazza', scala: 1.03 }
  ];
  function inseguitrici() {
    if (stato === 'menu') return;
    var fronte = MARF_X - 30 - Math.max(g.distacco, 0);
    var fase = g.t * 14;
    for (var i = RAGAZZE.length - 1; i >= 0; i--) {
      var r = RAGAZZE[i], R = RIG[r.rig];
      var x = fronte - i * 46, y = TERRA - Math.abs(Math.sin(fase + i)) * 4;
      if (x < -60) continue;
      ctx.save(); ctx.translate(x, y);
      if (R && R.pronto && g.ragazze && g.ragazze[i].posa) {
        var gr = g.ragazze[i];
        ctx.translate(0, TERRA - y);                    // il rimbalzo lo fa già lo scheletro
        ctx.scale(r.scala, r.scala);
        personaggio(R, gr.anca, gr.posa);
        ctx.fillStyle = '#ff5c8a'; cuore(16, -112 - Math.abs(Math.sin(fase * 0.5 + i)) * 10, 7);
      } else {
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#e8b98f'; ctx.lineWidth = 7;
        var a = Math.sin(fase + i * 1.3) * 0.8;
        gamba(-3, -30, a); gamba(3, -30, -a);
        ctx.fillStyle = r.vestito;
        ctx.beginPath(); ctx.moveTo(-18, -30); ctx.lineTo(18, -30); ctx.lineTo(10, -70); ctx.lineTo(-10, -70); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#e8b98f'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(6, -64); ctx.lineTo(30, -76 + Math.sin(fase + i) * 6); ctx.stroke();
        ctx.fillStyle = r.capelli; ctx.beginPath(); ctx.arc(-4, -86, 21, 0, Math.PI * 2); ctx.fill();
        ctx.fillRect(-24, -88, 14, 34);
        ctx.fillStyle = '#e8b98f'; ctx.beginPath(); ctx.arc(2, -86, 16, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(8, -89, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#d2452f'; ctx.beginPath(); ctx.arc(11, -79, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ff5c8a'; cuore(14, -112 - Math.abs(Math.sin(fase * 0.5 + i)) * 10, 7);
      }
      ctx.restore();
      if (g.fumetto && g.fumetto.chi === i && stato === 'gioco') fumetto(x, y - 120, g.fumetto.testo);
    }
  }
  function cuore(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
    ctx.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.6, y - s * 1.4, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.6, y - s * 1.4, x + s * 1.6, y - s * 0.2, x, y + s * 0.9);
    ctx.fill();
  }
  function fumetto(x, y, testo) {
    ctx.font = 'italic 700 16px "Chakra Petch", sans-serif';
    var w = ctx.measureText(testo).width + 22;
    var bx = Math.max(8, x - w / 2);
    ctx.fillStyle = '#f4efe2'; smusso(bx, y - 31, w, 28, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 6, y - 4); ctx.lineTo(x + 6, y - 4); ctx.lineTo(x - 2, y + 8); ctx.fill();
    ctx.fillStyle = '#ff5c8a'; ctx.fillRect(bx, y - 31, 3, 28);
    ctx.fillStyle = '#121216'; ctx.textAlign = 'left'; ctx.fillText(testo, bx + 11, y - 11);
  }


  function cuore(x, y, colore) {
    ctx.fillStyle = colore; ctx.beginPath();
    ctx.moveTo(x, y + 7); ctx.bezierCurveTo(x - 13, y - 2, x - 6, y - 12, x, y - 5);
    ctx.bezierCurveTo(x + 6, y - 12, x + 13, y - 2, x, y + 7); ctx.fill();
  }
  // pannello con angoli tagliati (stile della UI)
  function smusso(x, y, w, h, c) {
    ctx.beginPath();
    ctx.moveTo(x + c, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h - c);
    ctx.lineTo(x + w - c, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + c); ctx.closePath();
  }
  function obliquo(x, y, w, h, k) {
    ctx.beginPath(); ctx.moveTo(x + k, y); ctx.lineTo(x + w + k, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath();
  }
  function hud() {
    ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    // sinistra: metri, canne, record
    ctx.fillStyle = 'rgba(10,10,14,.72)'; smusso(12, 12, 250, 64, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 1; smusso(12.5, 12.5, 249, 63, 12); ctx.stroke();
    ctx.fillStyle = '#e4b33c'; ctx.fillRect(12, 24, 3, 40);
    ctx.fillStyle = '#f4efe2'; ctx.font = 'italic 700 32px "Chakra Petch", sans-serif';
    var mt = String(Math.floor(g.metri));
    ctx.fillText(mt, 26, 45);
    var mw = ctx.measureText(mt).width;
    ctx.fillStyle = '#e4b33c'; ctx.font = '600 13px "Chakra Petch", sans-serif';
    ctx.fillText('M', 30 + mw, 45);
    ctx.font = '500 12px "DM Mono", monospace'; ctx.fillStyle = 'rgba(244,239,226,.55)';
    ctx.textAlign = 'right'; ctx.fillText('REC ' + record, 248, 66); ctx.textAlign = 'left';
    if (pronta(OGG.canna)) ctx.drawImage(cache(OGG.canna, 22, 17), 26, 53, 22, 17);
    ctx.fillStyle = '#f4efe2'; ctx.font = '500 13px "DM Mono", monospace';
    ctx.fillText('× ' + g.birre, 52, 66);
    // destra: distacco a segmenti, vite, scudo
    var px = W - 262;
    ctx.fillStyle = 'rgba(10,10,14,.72)'; smusso(px, 12, 250, 64, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.10)'; smusso(px + .5, 12.5, 249, 63, 12); ctx.stroke();
    ctx.fillStyle = '#ff5c8a'; ctx.fillRect(W - 15, 24, 3, 40);
    ctx.font = '500 11px "DM Mono", monospace'; ctx.fillStyle = 'rgba(244,239,226,.55)';
    ctx.fillText('FEMMINE', px + 14, 30);
    var p = 1 - Math.max(g.distacco, 0) / 260, seg = 10, sw = 15;
    for (var i = 0; i < seg; i++) {
      var on = i < Math.round(p * seg);
      ctx.fillStyle = on ? (p > 0.7 ? '#d2452f' : '#ff5c8a') : 'rgba(255,255,255,.12)';
      obliquo(px + 80 + i * sw, 21, sw - 5, 10, 4); ctx.fill();
    }
    var vite = 3 - g.colpi;
    ctx.fillStyle = 'rgba(244,239,226,.55)'; ctx.fillText('VITE', px + 14, 64);
    for (var v = 0; v < Math.max(3, vite); v++) {
      ctx.fillStyle = v < vite ? (v >= 3 ? '#e4b33c' : '#ff5c8a') : 'rgba(255,255,255,.14)';
      obliquo(px + 52 + v * 22, 52, 14, 14, 5); ctx.fill();
    }
    if (g.scudo > 0) {
      ctx.textAlign = 'right'; ctx.fillStyle = '#7fe3ff'; ctx.font = 'italic 700 15px "Chakra Petch", sans-serif';
      ctx.fillText('SCUDO ' + Math.ceil(g.scudo) + 's', W - 26, 65);
    }
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  /* ── Ciclo ── */
  var ultimo = performance.now();
  function ciclo(ora) {
    var dt = Math.min((ora - ultimo) / 1000, 1 / 20);
    ultimo = ora;
    aggiorna(dt);
    disegna();
    requestAnimationFrame(ciclo);
  }
  requestAnimationFrame(ciclo);
})();
