<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 -14 92 90" role="img" aria-label="Fucine Creative Micidiali">
  <title>Fucine Creative Micidiali</title>
  <!-- un martello in piena corsa (linee di velocità) che batte su un controller e lo "forgia" -->

  <!-- scintille dell'impatto -->
  <g fill="none" stroke="#f6d77a" stroke-width="3.2" stroke-linecap="round">
    <path d="M53 33 L46 29"/>
    <path d="M56 26 L52 19"/>
    <path d="M75 31 L82 27"/>
    <path d="M73 24 L77 17"/>
  </g>

  <!-- controller -->
  <path fill="#f0ead6" d="M44 46c0-6 5-10 11-10h34c6 0 11 4 11 10l4 16c1.5 6-2 10-7 10c-4 0-6-2-8-5l-3-4H58l-3 4c-2 3-4 5-8 5c-5 0-8.5-4-7-10z"/>
  <g fill="#0d0d0c">
    <rect x="50" y="48" width="12" height="4" rx="1"/>
    <rect x="54" y="44" width="4" height="12" rx="1"/>
    <circle cx="88" cy="45.5" r="2.6"/>
    <circle cx="94" cy="50.5" r="2.6"/>
    <circle cx="82" cy="50.5" r="2.6"/>
    <circle cx="88" cy="55.5" r="2.6"/>
  </g>

  <!-- martello: la faccia batte sul bordo del controller -->
  <g transform="translate(66 36) rotate(-10)">
    <!-- linee di velocità lungo l'arco del colpo, attorno alla mano -->
    <g fill="none" stroke="#e4b33c" stroke-linecap="round">
      <path d="M4.4 -26 A46 46 0 0 0 -10.4 -46.2" stroke-width="4" opacity=".95"/>
      <path d="M-3.9 -25.7 A38 38 0 0 0 -13.1 -37.9" stroke-width="3.6" opacity=".65"/>
      <path d="M-11.8 -24.3 A30 30 0 0 0 -17 -30.3" stroke-width="3.2" opacity=".4"/>
    </g>
    <!-- manico -->
    <rect x="-42" y="-14" width="37" height="6" rx="3" fill="#c8bfa8"/>
    <!-- testa -->
    <rect x="-7" y="-23" width="14" height="23" rx="2.5" fill="#e4b33c"/>
    <rect x="-7" y="-4" width="14" height="4" rx="1.5" fill="#b88a1e"/>
  </g>
</svg>
