<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <!--
    PAGINA 404 + VECCHI INDIRIZZI
    GitHub Pages mostra questa pagina per ogni indirizzo che non esiste, a qualsiasi profondità:
    per questo qui dentro i percorsi partono tutti da "/".

    Quando sposti o rinomini una pagina, aggiungi una riga in SPOSTATI qui sotto
    ('vecchio percorso': 'nuovo percorso') invece di lasciare una cartella col solo redirect.
  -->
  <script>
    (function () {
      var SPOSTATI = {
        '/BlackjackTromba/':     '/giochi/bisca-del-tromba/',
        '/leaderboard.html':     '/giochi/bisca-del-tromba/',
        '/giochi/slenderrino/':  '/giochi/resident-crevil/',
      };
      var p = location.pathname.replace(/index\.html$/, '');
      if (!/\/$/.test(p) && !/\.[a-z0-9]+$/i.test(p)) p += '/';
      var nuovo = SPOSTATI[p];
      if (!nuovo) {
        // anche le sottocartelle e i file del vecchio indirizzo (es. /BlackjackTromba/qualcosa.html)
        for (var vecchio in SPOSTATI) {
          if (/\/$/.test(vecchio) && p.indexOf(vecchio) === 0) { nuovo = SPOSTATI[vecchio]; break; }
        }
      }
      if (nuovo) location.replace(nuovo + location.search + location.hash);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Qui non c'è niente · GoGoBar</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/risorse/img/icone/favicon-32.png">
  <link rel="apple-touch-icon" href="/risorse/img/icone/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=DM+Mono:wght@400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0d0d0c; --ivory: #f0ead6; --cream: #c8bfa8; --muted: #77715f; --gold: #e4b33c; --line: #2a2a27; }
    body { background: var(--bg); color: var(--ivory); font-family: 'DM Sans', sans-serif; min-height: 100vh;
           display: grid; place-items: center; padding: 2rem 1rem; text-align: center; }
    img { width: min(180px, 45vw); height: auto; margin-bottom: 1.5rem; filter: drop-shadow(0 10px 30px rgba(0,0,0,.6)); }
    .codice { font-family: 'DM Mono', monospace; font-size: .75rem; letter-spacing: .2em; color: var(--muted); }
    h1 { font-family: Fredoka, 'DM Sans', sans-serif; font-size: clamp(2rem, 7vw, 3.4rem); margin: .4rem 0 .8rem; }
    h1 em { color: var(--gold); font-style: normal; }
    p { color: var(--cream); max-width: 32rem; margin: 0 auto 1.8rem; line-height: 1.5; }
    a { display: inline-block; padding: .8rem 1.4rem; border-radius: 999px; background: var(--gold); color: #1a1405;
        font-weight: 500; text-decoration: none; }
    a:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <main>
    <img src="/risorse/img/maneki-neko.webp" alt="" width="689" height="900">
    <div class="codice">ERRORE 404</div>
    <h1>Qui non c'è <em>niente</em></h1>
    <p>Questa pagina non esiste, o si è spostata. Il bar però è sempre aperto.</p>
    <a href="/">Torna al GoGoBar</a>
  </main>
</body>
</html>
