<!DOCTYPE html>
<html lang="it" data-filodiffusione>
<head>
  <meta charset="UTF-8" />
  <!-- filodiffusione: tra le pagine con data-filodiffusione la musica non si ferma (vedi js/filodiffusione.js) -->
  <script src="js/filodiffusione.js?v=2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GoGoBar · Collettivo M.I.A.O.</title>
  <meta name="description" content="Video, musica e giochi del Collettivo M.I.A.O.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0d0c;
      --surface: #161614;
      --raised:  #1d1d1a;
      --line:    #2a2a26;
      --ivory:   #f4efe2;
      --cream:   #c9c0a9;
      --muted:   #77715f;
      --gold:    #e4b33c;
      --gold-2:  #f6d77a;
      --red:     #d2452f;
      --blue:    #4a8fa8;
      --display: 'Fredoka', 'DM Sans', sans-serif;
      --mono:    'DM Mono', monospace;
      --sans:    'DM Sans', sans-serif;
      --radius:  18px;
      --pad:     clamp(1rem, 4vw, 4rem);
    }

    html { scroll-behavior: smooth; overflow-x: clip; }
    body {
      background: var(--bg);
      color: var(--ivory);
      font-family: var(--sans);
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; }
    img { max-width: 100%; }

    /* ── NAV ── */
    .nav {
      position: sticky; top: 0; z-index: 20;
      /* tre colonne: logo | sezioni (sempre al centro) | saldo e account.
         Le colonne laterali sono uguali, così il saldo che cresce non sposta le icone */
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem;
      padding: .9rem var(--pad);
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-family: var(--display); font-weight: 700; font-size: 2rem; line-height: 1;
      text-decoration: none; letter-spacing: -.01em;
    }
    .brand span { color: var(--gold); }
    .nav-links { display: flex; gap: .3rem; }
    .nav-links a {
      font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase;
      text-decoration: none; color: var(--cream);
      padding: .5rem .85rem; border-radius: 999px;
      transition: background .2s, color .2s;
    }
    .nav-links a:hover { background: var(--raised); color: var(--gold-2); }
    .nav-links { align-items: center; }
    .nav .brand { justify-self: start; }
    .nav-destra { justify-self: end; }
    .nav-links a.nav-icona { display: grid; place-items: center; width: 2.6rem; height: 2.6rem; padding: 0; }
    .nav-links button.nav-icona { display: grid; place-items: center; width: 2.6rem; height: 2.6rem; padding: 0; border-radius: 999px; color: var(--cream); background: none; border: 0; cursor: pointer; }
    .nav-links button.nav-icona:hover { background: var(--raised); color: var(--gold-2); }
    .nav-radio.radio-on { color: var(--gold); }
    .nav-icona svg { width: 1.45rem; height: 1.45rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .brand { display: inline-flex; align-items: center; gap: .45rem; }
    .brand img { width: 1.15em; height: 1.15em; display: block; flex: none; }
    .nav-account {
      font-family: var(--mono); font-size: .72rem; letter-spacing: .06em;
      color: var(--gold-2); background: none; cursor: pointer;
      border: 1px solid rgba(228,179,60,.45); border-radius: 999px; padding: .45rem .8rem;
      max-width: 11rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none;
      transition: background .2s;
    }
    .nav-account:hover { background: rgba(228,179,60,.1); }

    /* ── HERO ── */
    .hero {
      position: relative;
      display: grid; grid-template-columns: 1.25fr 1fr; align-items: center; gap: 2rem;
      padding: clamp(2.5rem, 6vw, 5rem) var(--pad) clamp(2rem, 5vw, 4rem);
      overflow: hidden;
      isolation: isolate;
    }
    /* griglia di puntini, nitida, che sfuma verso il basso */
    .hero::before {
      content: ''; position: absolute; inset: 0; z-index: -1;
      background-image: radial-gradient(rgba(228,179,60,.22) 1.2px, transparent 1.3px);
      background-size: 22px 22px;
      -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent 100%);
              mask-image: linear-gradient(to bottom, #000 30%, transparent 100%);
    }
    .hero-logo { display: block; width: min(100%, 620px); height: auto; margin-left: -1.5%; }
    .hero-text {
      margin-top: 1.2rem;
      font-family: var(--display); font-weight: 600;
      font-size: clamp(1.5rem, 3vw, 2.3rem); line-height: 1.15; color: var(--cream);
    }
    .hero-text b { color: var(--gold); font-weight: 700; }
    .cta { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: 1.8rem; }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      font-family: var(--display); font-weight: 600; font-size: 1rem;
      text-decoration: none; padding: .8rem 1.4rem; border-radius: 999px;
      border: 2px solid var(--gold); transition: transform .15s, background .2s, color .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--gold); color: #1a1408; }
    .btn-primary:hover { background: var(--gold-2); border-color: var(--gold-2); }
    .btn-ghost { color: var(--gold-2); }
    .btn-ghost:hover { background: rgba(228,179,60,.1); }

    /* mascotte */
    .mascot { position: relative; justify-self: center; width: min(100%, 400px); aspect-ratio: 1; margin-bottom: 4.5rem; }
    .mascot .sun {
      position: absolute; inset: 6%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--gold) 0 8.33%, #d79f2a 0 16.66%, var(--gold) 0 25%, #d79f2a 0 33.33%,
                  var(--gold) 0 41.66%, #d79f2a 0 50%, var(--gold) 0 58.33%, #d79f2a 0 66.66%,
                  var(--gold) 0 75%, #d79f2a 0 83.33%, var(--gold) 0 91.66%, #d79f2a 0 100%);
      animation: spin 40s linear infinite;
      border: 6px solid #0d0d0c;
      box-shadow: 0 0 0 3px var(--gold);
    }
    .mascot .float {
      position: absolute; inset: 0;
      animation: bob 3.2s ease-in-out infinite;
    }
    .mascot .neko {
      position: absolute; left: 50%; bottom: 23%;
      width: 58%; height: auto; transform: translateX(-50%);
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
    }
    .mascot .cloud {
      position: absolute; left: 50%; bottom: -4%;
      width: 104%; height: auto; transform: translateX(-50%);
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.45));
    }
    /* clicker: il maneki neko dà GoGoldBar */
    .mascot { scroll-margin-top: 5rem; }
    .mascot .neko { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-drag: none; transition: transform .08s; }
    .mascot .neko.tocco { animation: tocco .22s ease-out; }
    @keyframes tocco { 0% { transform: translateX(-50%) scale(1); } 35% { transform: translateX(-50%) scale(.9, .86) translateY(6%); } 100% { transform: translateX(-50%) scale(1); } }
    .ggb-piu { position: absolute; z-index: 3; pointer-events: none; font-family: var(--display); font-weight: 700; font-size: 1.6rem; color: #fff3c4;
      text-shadow: 0 2px 0 #7a5512, 0 0 12px rgba(228,179,60,.8); animation: piu 1s ease-out forwards; white-space: nowrap; }
    @keyframes piu { from { transform: translate(-50%, 0) scale(.7); opacity: 1; } to { transform: translate(-50%, -90px) scale(1.15); opacity: 0; } }
    .ggb-banco { position: absolute; left: 50%; bottom: -3.2rem; transform: translateX(-50%); z-index: 2; text-align: center; white-space: nowrap; }
    .ggb-banco b { display: inline-flex; align-items: center; gap: .35rem; font-family: var(--display); font-size: 1.9rem; font-weight: 700; color: var(--gold-2); line-height: 1; }
    .ggb-banco b .ggb-ico { width: .8em; height: .76em; }
    .ggb-banco small { display: block; margin-top: .25rem; font-family: var(--mono); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .ggb-banco button { background: none; border: 0; color: var(--gold-2); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
    .ggb-fumetto { position: absolute; left: 50%; top: 2%; transform: translateX(-50%); z-index: 4; width: max-content; max-width: 90%;
      background: var(--ivory, #f4efe2); color: #1a1408; border-radius: 14px; padding: .55rem .8rem; font-size: .85rem; line-height: 1.3; text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,.4); }
    .ggb-fumetto button { background: none; border: 0; padding: 0; font: inherit; font-weight: 700; text-decoration: underline; color: inherit; cursor: pointer; }
    /* saldo nel menu */
    .nav-ggb { display: inline-flex !important; align-items: center; gap: .3rem; font-family: var(--display) !important; font-weight: 700; font-size: .95rem !important;
      color: var(--gold-2) !important; padding: .4rem .7rem !important; white-space: nowrap; }
    .nav-ggb[hidden] { display: none !important; }
    .nav-ggb .ggb-ico { width: .85em; height: .8em; }
    .ggb-miao { font-size: 1.9rem; animation-duration: 1.4s; }
    /* +1 raro nel banner */
    .ticker span.ggb-raro { padding: 0 .6rem; }
    .ticker span.ggb-raro button { pointer-events: auto; cursor: pointer; font: inherit; color: #fff3c4; background: #1a1408; border: 2px solid #fff3c4; border-radius: 999px;
      padding: .05rem .7rem; animation: brilla 1s ease-in-out infinite alternate; }
    @keyframes brilla { to { box-shadow: 0 0 14px #fff3c4; } }
    /* lucchetti */
    .lucchetto { position: absolute; top: .7rem; left: .7rem; z-index: 2; display: inline-flex; align-items: center; gap: .3rem; background: rgba(13,13,12,.88);
      color: var(--gold-2); border: 1px solid var(--gold); border-radius: 999px; padding: .3rem .65rem; font-family: var(--display); font-weight: 700; font-size: .9rem; }
    .bloccato .card-media img, .bloccato .album-cover .faccia { filter: grayscale(.85) brightness(.55); }
    .album-card .album-cover .lucchetto { z-index: 5; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-12px) rotate(1deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .mascot .float, .mascot .sun, .ticker { animation: none !important; } }

    /* ── TICKER ── */
    .ticker-band { overflow: hidden; padding: .8rem 0; }
    .ticker-wrap { background: var(--gold); color: #1a1408; overflow: hidden; padding: .7rem 0; transform: rotate(-1deg); margin: 0 -1rem; }
    .ticker { display: flex; width: max-content; animation: ticker 30s linear infinite; }
    .ticker span {
      font-family: var(--display); font-weight: 700; font-size: 1.05rem; text-transform: uppercase;
      letter-spacing: .04em; padding: 0 1.2rem; white-space: nowrap;
    }
    .ticker span.dot { padding: 0; }
    @keyframes ticker { to { transform: translateX(-50%); } }

    /* ── SEZIONI ── */
    section.block { padding: clamp(2.5rem, 5vw, 4rem) var(--pad) 0; scroll-margin-top: 4rem; }
    .block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.4rem; }
    .block-head h2 { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 3vw, 2.2rem); letter-spacing: -.01em; }
    .block-head h2 small { font-family: var(--mono); font-weight: 400; font-size: .8rem; color: var(--muted); margin-left: .5rem; letter-spacing: .08em; }
    .block-head a { font-family: var(--mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); text-decoration: none; white-space: nowrap; }
    .block-head a:hover { color: var(--gold-2); }

    /* card generica */
    .card {
      position: relative; display: flex; flex-direction: column;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      overflow: hidden; text-decoration: none; color: inherit;
      transition: transform .2s, border-color .2s, background .2s;
    }
    a.card:hover { transform: translateY(-4px); border-color: var(--gold); background: var(--raised); }
    .card-media { position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
    .card-media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
    a.card:hover .card-media img { transform: scale(1.04); }
    .card-body { padding: 1.1rem 1.2rem 1.3rem; display: flex; flex-direction: column; gap: .45rem; flex: 1; }
    .card-kicker { font-family: var(--mono); font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
    .card h3 { font-family: var(--display); font-weight: 600; font-size: 1.25rem; line-height: 1.15; }
    .card p { font-size: .9rem; line-height: 1.55; color: var(--cream); }
    .tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: auto; padding-top: .5rem; }
    .tag { font-family: var(--mono); font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--cream); background: var(--raised); border: 1px solid var(--line); padding: .25rem .55rem; border-radius: 999px; }
    .card.soon { opacity: .6; }
    .card.soon .tag:first-child { color: var(--gold); border-color: rgba(228,179,60,.4); }
    .play {
      position: absolute; top: .8rem; right: .8rem; width: 2.4rem; height: 2.4rem; border-radius: 50%;
      background: var(--gold); color: #1a1408; display: grid; place-items: center; font-size: .9rem;
      opacity: 0; transform: scale(.8); transition: opacity .2s, transform .2s;
    }
    a.card:hover .play { opacity: 1; transform: none; }
    a.album-card:hover .album-info .play { background: var(--gold-2); }

    /* in evidenza: 3 colonne */
    .highlights { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 1rem; }
    .highlights .card:first-child h3 { font-size: 1.6rem; }

    /* classifica */
    .board { padding: 1.2rem 1.3rem 1.3rem; gap: .8rem; }
    .board h3 { display: flex; align-items: center; gap: .5rem; }
    .board ol { list-style: none; display: flex; flex-direction: column; gap: .35rem; counter-reset: pos; }
    .board li {
      counter-increment: pos; display: flex; align-items: center; gap: .7rem;
      background: var(--raised); border-radius: 10px; padding: .5rem .7rem; font-size: .92rem;
    }
    .board li::before { content: counter(pos); font-family: var(--display); font-weight: 700; color: var(--muted); width: 1.2rem; text-align: center; }
    .board li:nth-child(1)::before { color: var(--gold); }
    .board li:nth-child(2)::before { color: #c9c9c9; }
    .board li:nth-child(3)::before { color: #c07a3e; }
    .board li .nome { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .board li .punti { font-family: var(--mono); color: var(--gold-2); }
    .board .vuoto { font-size: .9rem; color: var(--cream); line-height: 1.5; }
    .board .btn { align-self: flex-start; font-size: .9rem; padding: .55rem 1.1rem; margin-top: auto; }
    .board { min-width: 0; }
    .board-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .board-frecce { display: flex; gap: .3rem; }
    .board-frecce button, .board-pallini button { border: 0; cursor: pointer; font: inherit; }
    .board-frecce button {
      width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--raised); color: var(--ivory);
      font-size: 1.2rem; line-height: 1; display: grid; place-items: center; transition: background .2s, color .2s;
    }
    .board-frecce button:hover { background: var(--gold); color: #1a1408; }
    .board-pista {
      display: grid; grid-auto-flow: column; grid-auto-columns: 100%; flex: 1;
      overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
    }
    .board-pista::-webkit-scrollbar { display: none; }
    .board-scheda { scroll-snap-align: start; display: flex; flex-direction: column; gap: .8rem; min-width: 0; padding-right: 2px; }
    .board-gioco { font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .board-scheda h3 { margin-top: -.5rem; }
    .board-pallini { display: flex; justify-content: center; gap: .4rem; }
    .board-pallini button { width: .5rem; height: .5rem; border-radius: 50%; background: var(--line); padding: 0; transition: background .2s, width .2s; }
    .board-pallini button.on { background: var(--gold); width: 1.3rem; border-radius: 999px; }

    /* video: riga che scorre */
    .rail {
      display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 23%);
      gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 1rem;
      scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    }
    .rail > * { scroll-snap-align: start; }
    /* copertine delle playlist: effetto "pila" di video */
    .playlists { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); padding-top: 10px; }
    .playlist-card { overflow: visible; }
    .playlist-card::before, .playlist-card::after {
      content: ''; position: absolute; left: 8%; right: 8%; height: 10px; z-index: -1;
      background: #26261f; border: 1px solid #3a3a33; border-bottom: 0; border-radius: 12px 12px 0 0;
    }
    .playlist-card::before { top: -6px; }
    .playlist-card::after { top: -11px; left: 14%; right: 14%; opacity: .6; }
    .playlist-card .card-media { border-radius: var(--radius) var(--radius) 0 0; }
    .playlist-card h3 { font-size: 1.4rem; }
    .playlist-card p { font-size: .82rem; color: var(--muted); }
    .playlists { isolation: isolate; }
    /* album: copertina quadrata (niente card) che gira in 3D on hover + box info separato sotto */
    .album-card { display: flex; flex-direction: column; gap: .9rem; text-decoration: none; color: inherit; }
    .album-card .album-cover { position: relative; aspect-ratio: 1; perspective: 1100px; }
    .album-card .flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.3,.7,.3,1); }
    .album-card .faccia { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 14px 30px rgba(0,0,0,.55); background: #111; }
    .album-card .faccia > * { width: 100%; height: 100%; border-radius: 0; }
    .album-card .faccia.retro { transform: rotateY(180deg); }
    .album-card .faccia.retro img { object-fit: cover; display: block; }
    /* tilt quando passi sul box info, flip quando passi sulla copertina */
    a.album-card:has(.album-info:hover) .flip, a.album-card:not(.si-gira) .album-cover:hover .flip { transform: rotateY(-16deg) rotateX(4deg) scale(1.03); }
    a.album-card.si-gira .album-cover:hover .flip, .album-card.girata .flip { transform: rotateY(180deg) scale(1.03); }
    @media (prefers-reduced-motion: reduce) { .album-card .flip { transition: none; } }
    .album-info { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 3.6rem .95rem 1.1rem; display: flex; flex-direction: column; gap: .3rem; transition: border-color .2s, background .2s; }
    a.album-card:hover .album-info { border-color: var(--gold); background: var(--raised); }
    .album-info h3 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; line-height: 1.15; }
    .album-meta { font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
    .album-info .play { top: 50%; right: 1rem; margin-top: -1.2rem; opacity: 1; transform: none; }
    .rail .card h3 { font-size: 1.05rem; }
    .rail .card-body { padding: .85rem 1rem 1rem; }

    /* giochi / musica: griglia */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    /* musica: scaletta compatta su due colonne */
    .brani { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: .5rem; }
    .brano {
      display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto 2.2rem; align-items: center; gap: .8rem;
      padding: .8rem 1rem; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
      text-decoration: none; transition: border-color .2s, background .2s, transform .15s;
    }
    .brano:hover { border-color: var(--gold); background: var(--raised); transform: translateY(-2px); }
    .brano-n { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
    .brano-testo { min-width: 0; }
    .brano-titolo { display: block; font-family: var(--display); font-weight: 600; font-size: 1.05rem; }
    .brano-artisti { display: block; font-size: .8rem; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brano-durata { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
    .brano-play { width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; background: var(--raised); color: var(--gold); transition: background .2s, color .2s; }
    .brano:hover .brano-play { background: var(--gold); color: #1a1408; }
    .album-label { grid-column: 1 / -1; font-family: var(--display); font-weight: 600; font-size: 1.2rem; color: #f6d77a; margin: .6rem 0 .3rem; display: flex; align-items: center; gap: 1rem; }
    .album-label:first-child { margin-top: 0; }
    .album-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }

<script>
/*
 * Costruisce la homepage a partire da CONTENUTI (vedi contenuti.js).
 * Per aggiungere contenuti non serve toccare questo file.
 */
(function () {
  const BISCA = 'giochi/bisca-del-tromba/';

  // ── ticker ──
  const frasi = ['Fare casino', 'Schimicare', 'Bombolò', 'Disastri', 'Fuggi fuggi', 'Grida scimmiesche', 'Botte da orbi', 'Rumori forti'];
  // La striscia scorre di metà della sua lunghezza e poi ricomincia: ogni metà
  // deve essere più larga dello schermo, altrimenti per un attimo resta vuota.
  const ticker = document.getElementById('ticker');
  let raro = null;   // il +1 raro delle GoGoldBar (vedi sotto): una sola volta per giro della striscia
  function riempiTicker() {
    ticker.replaceChildren();
    const meta = document.createDocumentFragment();
    const giro = () => frasi.forEach(f => meta.append(el('span', null, f), el('span', 'dot', '✦')));
    giro();
    if (raro) {
      const sp = el('span', 'ggb-raro'), b = el('button', null, '+1');
      b.type = 'button'; b.title = 'Prendilo!';
      sp.append(b, el('span', 'dot', '✦'));
      meta.append(sp);
    }
    ticker.append(meta);
    let volte = 0;
    while (ticker.scrollWidth < innerWidth * 1.25 && volte++ < 20) { giro(); ticker.append(meta); }
    [...ticker.children].forEach(n => ticker.append(n.cloneNode(true)));
    ticker.style.animationDuration = Math.round(ticker.scrollWidth / 2 / 60) + 's'; // ~60 px al secondo
  }
  riempiTicker();
  window.GoGoBarTicker = { raro: function (fn) { raro = fn; riempiTicker(); } };
  ticker.addEventListener('click', e => { if (raro && e.target.closest('.ggb-raro button')) { const fn = raro; raro = null; riempiTicker(); fn(); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(riempiTicker);
  let tickerLarghezza = innerWidth;
  addEventListener('resize', () => { if (innerWidth > tickerLarghezza) { tickerLarghezza = innerWidth; riempiTicker(); } });

  // ── utilità ──
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  const pubblicato = i => i.link && !i.inArrivo;
  // miniature YouTube: prova la qualità più alta e scende se non esiste
  // (YouTube risponde con un'immagine grigia 120x90 quando una misura manca)
  const QUALITA = ['maxresdefault', 'sddefault', 'hqdefault'];
  function miniatura(img, id) {
    let k = 0;
    const prova = () => { img.src = 'https://i.ytimg.com/vi/' + id + '/' + QUALITA[k] + '.jpg'; };
    const avanti = () => { if (++k < QUALITA.length) prova(); };
    img.addEventListener('load', () => { if (img.naturalWidth <= 120) avanti(); });
    img.addEventListener('error', avanti);
    prova();
  }

  // i video YouTube portano alla pagina Video, già sul video giusto
  // tutti i video in una lista sola, qualunque sia il formato di contenuti.js
  // (anche se il browser ha ancora in cache una versione vecchia del file)
  const TUTTI = (typeof TUTTI_I_VIDEO !== 'undefined') ? TUTTI_I_VIDEO
    : ((typeof CONTENUTI !== 'undefined' && CONTENUTI.video) || []).flatMap(p =>
        p.video ? p.video.map(v => Object.assign({ playlist: p.playlist }, v)) : [p]);
  TUTTI.forEach(v => { if (v.youtube && !v.link) v.link = 'video/#' + v.youtube; });

  function card(item, kicker) {
    const ok = pubblicato(item);
    const box = el(ok ? 'a' : 'div', 'card' + (ok ? '' : ' soon'));
    if (ok) box.href = item.link; else box.setAttribute('aria-disabled', 'true');

    if (item.immagine || item.youtube) {
      const m = el('div', 'card-media');
      const i = el('img'); i.alt = ''; i.loading = 'lazy';
      if (item.immagine) i.src = item.immagine; else miniatura(i, item.youtube);
      m.append(i); box.append(m);
      if (ok && item.youtube) box.append(el('span', 'play', '▶'));
    }
    const body = el('div', 'card-body');
    if (kicker) body.append(el('span', 'card-kicker', kicker));
    body.append(el('h3', null, item.titolo));
    if (item.descrizione) body.append(el('p', null, item.descrizione));
    const t = (item.tag || []).slice();
    if (!ok) t.unshift('In arrivo');
    if (t.length) {
      const tags = el('div', 'tags');
      t.forEach(x => tags.append(el('span', 'tag', x)));
      body.append(tags);
    }
    box.append(body);
    return box;
  }

  // ── sezioni ──
  const video  = TUTTI;
  const giochi = CONTENUTI.giochi || [];
  const musica = (typeof TUTTI_I_BRANI !== 'undefined') ? TUTTI_I_BRANI
    : ((typeof CONTENUTI !== 'undefined' && CONTENUTI.musica) || []).flatMap(a =>
        a.brani ? a.brani.map(b => Object.assign({ album: a.album, copertina: a.copertina || '' }, b)) : [a]);
  const VUOTO = {
    video:  'I video stanno arrivando. Preparate i popcorn.',
    giochi: 'Nessun gioco ancora... ma arriveranno.',
    musica: 'Silenzio, per ora. Presto rumori forti.',
  };

  function riempi(nome, lista, contenitore) {
    document.querySelector('[data-count="' + nome + '"]').textContent = lista.filter(pubblicato).length || '';
    if (!lista.length) { contenitore.append(el('p', 'empty-note', VUOTO[nome])); return; }
    lista.forEach(i => contenitore.append(card(i)));
  }
  // video: una copertina per playlist, con la miniatura dell'ultimo video uscito
  document.querySelector('[data-count="video"]').textContent = video.filter(pubblicato).length || '';
  const pl = document.getElementById('playlists');
  if (!video.length) pl.append(el('p', 'empty-note', VUOTO.video));
  const nomiPlaylist = [...new Set(TUTTI.map(v => v.playlist || 'Video'))];
  nomiPlaylist.forEach(function (nome) {
    const lista = TUTTI.filter(v => (v.playlist || 'Video') === nome && pubblicato(v));
    if (!lista.length) return;
    const ultimo = lista[lista.length - 1];
    const box = card({
      titolo: nome,
      descrizione: 'Ultimo: ' + ultimo.titolo,
      youtube: ultimo.youtube,
      link: 'video/#' + ultimo.youtube,
    }, lista.length === 1 ? '1 video' : lista.length + ' video');
    box.classList.add('playlist-card');
    pl.append(box);
  });
  riempi('giochi', giochi, document.getElementById('grid-giochi'));
  // musica: una copertina per album, apre il player sul primo brano dell'album
  const gm = document.getElementById('grid-musica');
  const brani = musica.filter(b => b.file);
  document.querySelector('[data-count="musica"]').textContent = brani.length || '';
  if (!brani.length) gm.append(el('p', 'empty-note', VUOTO.musica));
  const secondi = d => { const [m, s] = String(d || '').split(':').map(Number); return (m * 60 + s) || 0; };
  const nomiAlbum = [...new Set(brani.map(b => b.album || 'Brani'))];
  nomiAlbum.forEach(function (nome) {
    const lista = brani.filter(b => (b.album || 'Brani') === nome);
    const tot = lista.reduce((t, b) => t + secondi(b.durata), 0);
    const box = el('a', 'album-card');
    box.href = 'musica/#' + lista[0].file.replace(/\.[^.]+$/, '');
    const m = el('div', 'album-cover');
    const info = (CONTENUTI.musica || []).find(a => a.album === nome) || {};
    const fronte = window.GoGoCopertina ? GoGoCopertina({ album: nome, copertina: info.copertina || lista[0].copertina }, '') : null;
    if (info.retro && fronte) {
      // fronte + retro: la card si gira on hover (su touch: primo tap gira, secondo apre)
      box.classList.add('si-gira');
      const flip = el('div', 'flip'), f1 = el('div', 'faccia fronte'), f2 = el('div', 'faccia retro');
      const img = new Image(); img.src = info.retro; img.alt = 'Retro di ' + nome; img.loading = 'lazy';
      f1.append(fronte); f2.append(img); flip.append(f1, f2); m.append(flip);
      box.addEventListener('click', function (e) {
        if (!matchMedia('(hover: none)').matches || box.classList.contains('girata')) return;
        e.preventDefault();
        document.querySelectorAll('.album-card.girata').forEach(c => c.classList.remove('girata'));
        box.classList.add('girata');
      });
    } else if (fronte) {
      const flip = el('div', 'flip'), f1 = el('div', 'faccia fronte');
      f1.append(fronte); flip.append(f1); m.append(flip);
    }
    const body = el('div', 'album-info');
    body.append(el('h3', null, nome));
    body.append(el('span', 'album-meta', (lista.length === 1 ? '1 brano' : lista.length + ' brani') + (tot ? ' · ' + Math.floor(tot / 60) + ' min' : '')));
    body.append(el('span', 'play', '▶'));
    box.append(m, body);
    gm.append(box);
  });

  // ── in evidenza: ultimo video + gioco in evidenza + classifica ──
  const hl = document.getElementById('highlights');
  const primoVideo = video.find(v => v.inEvidenza && pubblicato(v)) || video.find(pubblicato);
  if (primoVideo) hl.append(card(primoVideo, 'Video in evidenza'));
  const giocoTop = giochi.find(g => g.inEvidenza && pubblicato(g)) || giochi.find(pubblicato);
  if (giocoTop) hl.append(card(giocoTop, 'Gioca ora'));
  hl.append(classifica());

  // ── classifiche: una scheda per gioco, si scorrono in orizzontale ──
  // Per aggiungere un gioco: il suo classifica.js deve esporre
  // window.<api>.carica(n) → Promise<[{nome, punti}]>, poi aggiungi una riga qui.
  function classifica() {
    const GIOCHI_CLASSIFICA = [
      { gioco: 'La Bisca der Tromba', titolo: '🏆 I più lerci di GoGoBar', api: 'BiscaClassifica',
        link: BISCA, cta: 'Siediti al tavolo', punti: n => window.GoGoldBar ? GoGoldBar.valuta(n) : n.toLocaleString('it-IT') },
      { gioco: 'Corri Marf!', titolo: '💔 I peggio single', api: 'CorriMarfClassifica',
        link: 'giochi/corri-marf/', cta: 'Corri anche tu', punti: n => n.toLocaleString('it-IT') + ' m' },
      { gioco: 'Resident Crevil', titolo: '🌲 Usciti vivi dal greppo', api: 'ResidentCrevilClassifica',
        link: 'giochi/resident-crevil/', cta: 'Entra nel bosco', punti: n => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0') },
    ];
    const box = el('div', 'card board');
    const testa = el('div', 'board-head');
    const kicker = el('span', 'card-kicker', 'Classifiche');
    const frecce = el('div', 'board-frecce');
    const prev = el('button', null, '‹'), next = el('button', null, '›');
    prev.type = next.type = 'button';
    prev.setAttribute('aria-label', 'Classifica precedente');
    next.setAttribute('aria-label', 'Classifica successiva');
    frecce.append(prev, next);
    testa.append(kicker, frecce);
    const pista = el('div', 'board-pista');
    const pallini = el('div', 'board-pallini');
    box.append(testa, pista, pallini);

    GIOCHI_CLASSIFICA.forEach(function (g, i) {
      const scheda = el('div', 'board-scheda');
      scheda.append(el('span', 'board-gioco', g.gioco), el('h3', null, g.titolo));
      const corpo = el('div'); corpo.append(el('p', 'vuoto', 'Carico la classifica...'));
      const gioca = el('a', 'btn btn-ghost', g.cta); gioca.href = g.link;
      scheda.append(corpo, gioca);
      pista.append(scheda);
      const dot = el('button', null); dot.type = 'button';
      dot.setAttribute('aria-label', g.gioco);
      dot.onclick = () => vai(i);
      pallini.append(dot);

      function vuota() {
        corpo.replaceChildren(el('p', 'vuoto', 'Ancora nessun campione. Il primo posto è libero: vai a prendertelo.'));
      }
      const api = window[g.api];
      if (!api || typeof api.carica !== 'function') return vuota();
      Promise.resolve(api.carica(5)).then(function (righe) {
        if (!Array.isArray(righe) || !righe.length) return vuota();
        const ol = el('ol');
        righe.slice(0, 5).forEach(function (r) {
          const li = el('li');
          li.append(el('span', 'nome', r.nome), el('span', 'punti', g.punti(Number(r.punti) || 0)));
          ol.append(li);
        });
        corpo.replaceChildren(ol);
      }).catch(vuota);
    });

    const schede = () => pista.children.length;
    const attuale = () => pista.clientWidth ? Math.round(pista.scrollLeft / pista.clientWidth) : 0;
    function vai(i) { pista.scrollTo({ left: ((i + schede()) % schede()) * pista.clientWidth, behavior: 'smooth' }); }
    function segna() {
      const i = attuale();
      [...pallini.children].forEach((d, k) => d.classList.toggle('on', k === i));
    }
    prev.onclick = () => vai(attuale() - 1);
    next.onclick = () => vai(attuale() + 1);
    pista.addEventListener('scroll', segna, { passive: true });
    segna();
    requestAnimationFrame(segna);
    return box;
  }
})();
</script>
<script>
/* ════════════════════════════════════════════════════════════════
   GOGOLDBAR IN HOME: clicker sul maneki neko, saldo nel menu,
   +1 raro nel banner, lucchetti su Corri Marf! e Re-edit 2026
════════════════════════════════════════════════════════════════ */
(function () {
  const G = window.GoGoldBar;
  if (!G) return;
  const neko = document.querySelector('#neko .neko');
  const mascot = document.getElementById('neko');
  const banco = document.getElementById('ggb-banco');
  const nav = document.getElementById('nav-ggb');
  const contaMenu = document.createElement('span');
  let fumetto = null;   // "senza account le GoGoldBar scappano"

  nav.append(contaMenu); nav.insertAdjacentHTML('beforeend', G.icona);

  function disegna(st) {
    if (st.account && fumetto) { fumetto.remove(); fumetto = null; }
    if (!window.GoGoAccount || !GoGoAccount.attivo) { banco.replaceChildren(); nav.hidden = true; return; }
    if (!st.account) {
      nav.hidden = true;
      banco.innerHTML = '<small>Clicca il gatto per fare GoGoldBar</small><small><button type="button">👤 Crea il tuo account</button> per tenerle</small>';
      banco.querySelector('button').onclick = () => window.GoGoAccountUI && GoGoAccountUI.apri();
      return;
    }
    if (st.saldo == null) return;
    nav.hidden = false;
    contaMenu.textContent = G.formatta(st.saldo);
    banco.innerHTML = '<b><span></span>' + G.icona + '</b>';
    banco.querySelector('b span').textContent = G.formatta(st.saldo);
  }
  G.suCambio(disegna);
  disegna(G.stato());

  // suono della moneta, sintetizzato (nessun file da scaricare)
  let ac = null;
  function tin() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(1320 + Math.random() * 160, t);
      o.frequency.setValueAtTime(1980 + Math.random() * 160, t + .05);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.09, t + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t + .22);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .25);
    } catch (e) {}
  }

  function senzaAccount() {
    if (fumetto) return;
    fumetto = document.createElement('div');
    fumetto.className = 'ggb-fumetto';
    fumetto.innerHTML = 'Miao! Senza account le GoGoldBar scappano.<br><button type="button">👤 Crea il tuo account</button>';
    fumetto.querySelector('button').onclick = e => { e.stopPropagation(); window.GoGoAccountUI && GoGoAccountUI.apri(); };
    mascot.append(fumetto);
    setTimeout(() => { fumetto && fumetto.remove(); fumetto = null; }, 4500);
  }

  // miao raro: 0,02% dei tocchi (1 su 5000), per tutti, anche senza account.
  // Il file (CC0, vedi audio/LICENZA.txt) si scarica solo quando serve.
  const MIAO = 0.0002;
  function miao(e) {
    try { const a = new Audio('audio/miao.mp3'); a.volume = .9; a.play().catch(() => {}); } catch (err) {}
    const r = mascot.getBoundingClientRect();
    const m = document.createElement('span');
    m.className = 'ggb-piu ggb-miao';
    m.textContent = 'Miao!';
    m.style.left = (e.clientX - r.left) + 'px';
    m.style.top = (e.clientY - r.top - 44) + 'px';
    mascot.append(m);
    setTimeout(() => m.remove(), 1400);
  }

  neko.addEventListener('pointerdown', function (e) {
    if (e.button > 0) return;
    e.preventDefault();
    neko.classList.remove('tocco'); void neko.offsetWidth; neko.classList.add('tocco');
    if (Math.random() < (window.GOGOBAR_MIAO || MIAO)) miao(e);
    if (!window.GoGoAccount || !GoGoAccount.attivo) return;
    const n = G.clic();
    if (!n) { senzaAccount(); return; }
    tin();
    const r = mascot.getBoundingClientRect();
    const p = document.createElement('span');
    p.className = 'ggb-piu';
    p.textContent = '+' + n;
    p.style.left = (e.clientX - r.left) + 'px';
    p.style.top = (e.clientY - r.top - 20) + 'px';
    mascot.append(p);
    setTimeout(() => p.remove(), 1000);
  });
  neko.addEventListener('contextmenu', e => e.preventDefault());

  // +1 raro nel banner: 2% delle visite, finché non l'hai preso
  G.pronto.then(function () {
    const st = G.stato();
    if (!st.account || st.trofei.banner || !window.GoGoBarTicker) return;
    if (Math.random() < 0.02) GoGoBarTicker.raro(() => G.trofeo('banner'));
  });

  // lucchetti: Corri Marf! (gioco) e Re-edit 2026 (album)
  const SOLDI = n => G.formatta(n) + ' ' + G.icona;
  function lucchetti() {
    document.querySelectorAll('a[href*="giochi/corri-marf"]').forEach(a => {
      const chiuso = !G.sbloccato('corrimarf');
      a.classList.toggle('bloccato', chiuso);
      let l = a.querySelector('.lucchetto');
      if (chiuso && !l && a.querySelector('.card-media')) {
        l = document.createElement('span'); l.className = 'lucchetto';
        l.innerHTML = '🔒 ' + SOLDI(G.SBLOCCHI.corrimarf.prezzo);
        a.querySelector('.card-media').append(l);
      }
      if (!chiuso && l) l.remove();
    });
    document.querySelectorAll('a.album-card').forEach(a => {
      const nome = a.querySelector('h3') && a.querySelector('h3').textContent;
      const chiuso = G.albumBloccato(nome);
      a.classList.toggle('bloccato', chiuso);
      a.dataset.sblocco = chiuso ? Object.keys(G.SBLOCCHI).find(k => G.SBLOCCHI[k].album === nome) : '';
      let l = a.querySelector('.lucchetto');
      if (chiuso && !l) {
        l = document.createElement('span'); l.className = 'lucchetto';
        l.innerHTML = '🔒 ' + SOLDI(G.SBLOCCHI[a.dataset.sblocco].prezzo);
        a.querySelector('.album-cover').append(l);
      }
      if (!chiuso && l) l.remove();
    });
  }
  G.suCambio(lucchetti);
  G.pronto.then(lucchetti);
  lucchetti();
  // clic su un contenuto chiuso: prima si sblocca
  document.addEventListener('click', function (e) {
    const a = e.target.closest('a');
    if (!a) return;
    let id = null;
    if (/giochi\/corri-marf/.test(a.getAttribute('href') || '') && !G.sbloccato('corrimarf')) id = 'corrimarf';
    else if (a.classList.contains('album-card') && a.dataset.sblocco) id = a.dataset.sblocco;
    if (!id) return;
    e.preventDefault(); e.stopPropagation();
    G.chiediSblocco(id).then(ok => { if (ok) location.href = a.href; });
  }, true);

  if (location.hash === '#neko') setTimeout(() => mascot.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
})();
</script>
</body>
</html>
