<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video · GoGoBar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0c; --surface: #161614; --line: #2a2a27;
      --ivory: #f0ead6; --cream: #c8bfa8; --muted: #6b6658;
      --accent1: #e4b33c; --accent2: #c45c3a; --accent3: #4a8fa8;
      --mono: 'DM Mono', monospace; --serif: 'Fredoka', 'DM Sans', sans-serif; --sans: 'DM Sans', sans-serif;
    }
    body {
      background: var(--bg); color: var(--ivory); font-family: var(--sans); min-height: 100vh;
    }

    /* barra in alto */
    .top {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 1.2rem 4rem; border-bottom: 1px solid var(--line);
    }
    .top a { color: var(--cream); text-decoration: none; font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
    .top a:hover { color: var(--accent1); }
    .top a.logo { font-family: var(--serif); font-size: 1.4rem; letter-spacing: 0; text-transform: none; color: var(--ivory); font-weight: 700; }
    .top a.logo { display: inline-flex; align-items: center; gap: .4rem; }
    .top a.logo img { width: 1.15em; height: 1.15em; display: block; }
    .logo em { color: var(--accent1); font-style: normal; }

    /* player */
    .stage { padding: 2.5rem 4rem 2rem; border-bottom: 1px solid var(--line); scroll-margin-top: 0; }
    .player {
      position: relative; width: 100%; max-width: 1100px; margin: 0 auto;
      aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line);
      border-radius: 18px; overflow: hidden;
    }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .now {
      max-width: 1100px; margin: 1.4rem auto 0;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    .now-label { font-family: var(--mono); font-size: .65rem; letter-spacing: .18em; text-transform: uppercase; color: var(--accent1); margin-bottom: .4rem; }
    .now h1 { font-family: var(--serif); font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 700; line-height: 1.05; }
    .controls { display: flex; gap: .5rem; }
    .controls button {
      font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
      background: none; color: var(--ivory); border: 1px solid var(--line); padding: .6rem 1.1rem; border-radius: 999px; cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .controls button:hover { border-color: var(--accent1); color: var(--accent1); }

    /* elenco */
    .list { padding: 3rem 4rem 4rem; }
    .serie + .serie { margin-top: 2.5rem; }
    .section-label {
      font-family: var(--serif); font-weight: 600; font-size: 1.35rem; color: #f6d77a;
      margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    .item {
      background: var(--surface); color: inherit; text-decoration: none; display: block;
      position: relative; transition: background .25s, transform .2s;
      border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    }
    .item:hover { background: #1a1a17; }
    .item img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; filter: saturate(.85) brightness(.8); transition: filter .3s; }
    .item:hover img { filter: none; }
    .item .meta { padding: 1rem 1.2rem 1.3rem; }
    .item .num { font-family: var(--mono); font-size: .62rem; color: var(--accent1); letter-spacing: .15em; }
    .item h3 { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; margin-top: .35rem; }
    .item.attivo { border-color: var(--accent1); box-shadow: 0 0 0 1px var(--accent1); }
    .item.attivo .num::after { content: '  ▶ in riproduzione'; color: var(--cream); }

    .empty { font-family: var(--mono); color: var(--muted); padding: 3rem 4rem; }

    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 900px) {
      .top, .stage, .list { padding-left: 1rem; padding-right: 1rem; }
      .stage { padding-top: 1rem; }
      .grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .item h3 { font-size: .95rem; }
      .item .meta { padding: .7rem .8rem .9rem; }
    }
  </style>
  <link rel="icon" href="../favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/icone/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../img/icone/favicon-16.png">
  <link rel="apple-touch-icon" href="../img/icone/apple-touch-icon.png">
</head>
<body>

<div class="top">
  <a href="../" class="logo"><img src="../img/icone/icona-96.png" alt="" width="40" height="40">Go<em>Go</em>Bar</a>
  <a href="../">← Home</a>
</div>

<section class="stage" id="stage">
  <div class="player" id="player"></div>
  <div class="now">
    <div>
      <p class="now-label" id="now-label">Video</p>
      <h1 id="now-title"></h1>
    </div>
    <div class="controls">
      <button type="button" id="prev">← Prec</button>
      <button type="button" id="next">Succ →</button>
    </div>
  </div>
</section>

<section class="list">
  <div id="grid"></div>
</section>

<script src="../contenuti.js?v=21"></script>
<script src="../js/account.js?v=4"></script>
<script src="../js/gogoldbar.js?v=4"></script>
<script>
/*
 * Pagina Video: legge i video da contenuti.js.
 * Il video da mostrare è nel link dopo il # (es. video/#UoCs9tTNp_0),
 * così ogni video ha il suo link da mandare agli amici.
 */
(function () {
  // tutti i video in una lista sola, qualunque sia il formato di contenuti.js
  // (anche se il browser ha ancora in cache una versione vecchia del file)
  const TUTTI = (typeof TUTTI_I_VIDEO !== 'undefined') ? TUTTI_I_VIDEO
    : ((typeof CONTENUTI !== 'undefined' && CONTENUTI.video) || []).flatMap(p =>
        p.video ? p.video.map(v => Object.assign({ playlist: p.playlist }, v)) : [p]);
  const video = TUTTI.filter(v => v.youtube && !v.inArrivo);
  const grid = document.getElementById('grid');

  if (!video.length) {
    document.getElementById('stage').hidden = true;
    grid.outerHTML = '<p class="empty">Ancora nessun video. Preparate i popcorn.</p>';
    return;
  }

  // posizione di ogni video dentro la sua playlist (es. 2 di 4)
  const pos = video.map(v => {
    const stessa = video.filter(x => x.playlist === v.playlist);
    return { n: stessa.indexOf(v) + 1, tot: stessa.length };
  });

  // copertine, raggruppate per playlist
  let griglia = null, ultima = null;
  video.forEach(function (v, i) {
    if (v.playlist !== ultima) {
      ultima = v.playlist;
      const label = document.createElement('p');
      label.className = 'section-label';
      label.textContent = v.playlist || 'Video';
      griglia = document.createElement('div');
      griglia.className = 'grid';
      const serie = document.createElement('div');
      serie.className = 'serie';
      serie.dataset.playlist = v.playlist || '';
      serie.append(label, griglia);
      grid.append(serie);
    }
    const a = document.createElement('a');
    a.className = 'item';
    a.href = '#' + v.youtube;
    a.dataset.id = v.youtube;
    const img = document.createElement('img');
    img.src = 'https://i.ytimg.com/vi/' + v.youtube + '/hqdefault.jpg';
    img.alt = ''; img.loading = 'lazy';
    const meta = document.createElement('div'); meta.className = 'meta';
    const num = document.createElement('p'); num.className = 'num'; num.textContent = String(pos[i].n).padStart(2, '0');
    const h = document.createElement('h3'); h.textContent = v.titolo;
    meta.append(num, h);
    a.append(img, meta);
    griglia.append(a);
  });

  const ordine = new Map([...grid.querySelectorAll('.serie')].map((el, i) => [el, i]));
  let corrente = -1;

  function mostra(i, autoplay) {
    i = (i + video.length) % video.length;
    if (i === corrente) return;
    corrente = i;
    const v = video[i];
    const iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.youtube) +
                 '?rel=0&modestbranding=1&enablejsapi=1&origin=' + encodeURIComponent(location.origin) + (autoplay ? '&autoplay=1' : '');
    iframe.title = v.titolo;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    document.getElementById('player').replaceChildren(iframe);
    segui(iframe, v.youtube);
    document.getElementById('now-title').textContent = v.titolo;
    document.getElementById('now-label').textContent = (v.playlist ? v.playlist + ' · ' : '') + pos[i].n + ' di ' + pos[i].tot;
    document.title = v.titolo + ' · GoGoBar';
    grid.querySelectorAll('.item').forEach(el => el.classList.toggle('attivo', el.dataset.id === v.youtube));
    // sotto al player, prima la serie del video che stai guardando, poi le altre nell'ordine solito
    const serie = [...grid.querySelectorAll('.serie')];
    serie.sort((a, b) => (b.dataset.playlist === (v.playlist || '')) - (a.dataset.playlist === (v.playlist || '')) || ordine.get(a) - ordine.get(b));
    serie.forEach(el => grid.append(el));
  }

  // GoGoldBar: un video conta come visto se ne hai guardato davvero almeno l'80%
  // (API IFrame di YouTube; se non si carica, il player funziona lo stesso)
  let apiYT = null, timerVisto = null;
  function caricaApiYT() {
    if (apiYT) return apiYT;
    apiYT = new Promise(function (ok) {
      if (window.YT && YT.Player) return ok();
      const prima = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function () { if (prima) prima(); ok(); };
      const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
      document.head.appendChild(s);
    });
    return apiYT;
  }
  function segui(iframe, id) {
    clearInterval(timerVisto);
    if (!window.GoGoldBar) return;
    let visto = 0, ultimo = null, fatto = !!GoGoldBar.stato().video[id];
    caricaApiYT().then(function () {
      if (!iframe.isConnected) return;
      const p = new YT.Player(iframe, {
        events: {
          onStateChange: function (e) {
            clearInterval(timerVisto);
            if (e.data !== YT.PlayerState.PLAYING || fatto) return;
            ultimo = p.getCurrentTime();
            timerVisto = setInterval(function () {
              if (!iframe.isConnected) return clearInterval(timerVisto);
              const t = p.getCurrentTime(), dur = p.getDuration(), dt = t - ultimo;
              ultimo = t;
              if (dt > 0 && dt < 3) visto += dt;
              if (dur && visto >= dur * 0.8) { fatto = true; clearInterval(timerVisto); GoGoldBar.visto(id); }
            }, 1000);
          }
        }
      });
    });
  }

  function vai(i) {
    i = (i + video.length) % video.length;
    history.replaceState(null, '', '#' + video[i].youtube);
    mostra(i, true);
  }

  // click su una copertina: cambia video e torna su al player
  grid.addEventListener('click', function (e) {
    const a = e.target.closest('.item');
    if (!a) return;
    e.preventDefault();
    vai(video.findIndex(v => v.youtube === a.dataset.id));
    document.getElementById('stage').scrollIntoView({ behavior: 'smooth' });
  });
  document.getElementById('prev').onclick = () => vai(corrente - 1);
  document.getElementById('next').onclick = () => vai(corrente + 1);

  // apertura da un link con #codice
  const id = location.hash.slice(1);
  const iniziale = video.findIndex(v => v.youtube === id);
  const evidenza = video.findIndex(v => v.inEvidenza);
  mostra(iniziale >= 0 ? iniziale : Math.max(evidenza, 0), false);
})();
</script>
</body>
</html>
