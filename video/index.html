<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video · GoGoBar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0c; --surface: #161614; --line: #2a2a27;
      --ivory: #f0ead6; --cream: #c8bfa8; --muted: #6b6658;
      --accent1: #e4b33c; --accent2: #c45c3a; --accent3: #4a8fa8;
      --mono: 'DM Mono', monospace; --serif: 'Fredoka', 'DM Sans', sans-serif; --sans: 'DM Sans', sans-serif;
    }
    body {
      background: var(--bg); color: var(--ivory); font-family: var(--sans); min-height: 100vh;
    }

    /* barra in alto */
    .top {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 1.2rem 4rem; border-bottom: 1px solid var(--line);
    }
    .top a { color: var(--cream); text-decoration: none; font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
    .top a:hover { color: var(--accent1); }
    .top a.logo { font-family: var(--serif); font-size: 1.4rem; letter-spacing: 0; text-transform: none; color: var(--ivory); font-weight: 700; }
    .logo em { color: var(--accent1); font-style: normal; }

    /* player */
    .stage { padding: 2.5rem 4rem 2rem; border-bottom: 1px solid var(--line); scroll-margin-top: 0; }
    .player {
      position: relative; width: 100%; max-width: 1100px; margin: 0 auto;
      aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line);
      border-radius: 18px; overflow: hidden;
    }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .now {
      max-width: 1100px; margin: 1.4rem auto 0;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    .now-label { font-family: var(--mono); font-size: .65rem; letter-spacing: .18em; text-transform: uppercase; color: var(--accent1); margin-bottom: .4rem; }
    .now h1 { font-family: var(--serif); font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 700; line-height: 1.05; }
    .controls { display: flex; gap: .5rem; }
    .controls button {
      font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
      background: none; color: var(--ivory); border: 1px solid var(--line); padding: .6rem 1.1rem; border-radius: 999px; cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .controls button:hover { border-color: var(--accent1); color: var(--accent1); }

    /* elenco */
    .list { padding: 3rem 4rem 4rem; }
    .section-label {
      font-family: var(--mono); font-size: .65rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
      margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
    .item {
      background: var(--surface); color: inherit; text-decoration: none; display: block;
      position: relative; transition: background .25s, transform .2s;
      border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    }
    .item:hover { background: #1a1a17; }
    .item img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; filter: saturate(.85) brightness(.8); transition: filter .3s; }
    .item:hover img { filter: none; }
    .item .meta { padding: 1rem 1.2rem 1.3rem; }
    .item .num { font-family: var(--mono); font-size: .62rem; color: var(--accent1); letter-spacing: .15em; }
    .item h3 { font-family: var(--serif); font-size: 1.05rem; font-weight: 700; margin-top: .35rem; }
    .item.attivo { border-color: var(--accent1); box-shadow: 0 0 0 1px var(--accent1); }
    .item.attivo .num::after { content: '  ▶ in riproduzione'; color: var(--cream); }

    .empty { font-family: var(--mono); color: var(--muted); padding: 3rem 4rem; }

    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 900px) {
      .top, .stage, .list { padding-left: 1rem; padding-right: 1rem; }
      .stage { padding-top: 1rem; }
      .grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .item h3 { font-size: .95rem; }
      .item .meta { padding: .7rem .8rem .9rem; }
    }
  </style>
</head>
<body>

<div class="top">
  <a href="../" class="logo">Go<em>Go</em>Bar</a>
  <a href="../#video">← Torna al bar</a>
</div>

<section class="stage" id="stage">
  <div class="player" id="player"></div>
  <div class="now">
    <div>
      <p class="now-label" id="now-label">Video</p>
      <h1 id="now-title"></h1>
    </div>
    <div class="controls">
      <button type="button" id="prev">← Prec</button>
      <button type="button" id="next">Succ →</button>
    </div>
  </div>
</section>

<section class="list">
  <p class="section-label">Tutti i video</p>
  <div class="grid" id="grid"></div>
</section>

<script src="../contenuti.js"></script>
<script>
/*
 * Pagina Video: legge i video da contenuti.js.
 * Il video da mostrare è nel link dopo il # (es. video/#UoCs9tTNp_0),
 * così ogni video ha il suo link da mandare agli amici.
 */
(function () {
  const video = (CONTENUTI.video || []).filter(v => v.youtube && !v.inArrivo);
  const grid = document.getElementById('grid');

  if (!video.length) {
    document.getElementById('stage').hidden = true;
    grid.outerHTML = '<p class="empty">Ancora nessun video. Preparate i popcorn.</p>';
    return;
  }

  // copertine
  video.forEach(function (v, i) {
    const a = document.createElement('a');
    a.className = 'item';
    a.href = '#' + v.youtube;
    a.dataset.id = v.youtube;
    const img = document.createElement('img');
    img.src = 'https://i.ytimg.com/vi/' + v.youtube + '/hqdefault.jpg';
    img.alt = ''; img.loading = 'lazy';
    const meta = document.createElement('div'); meta.className = 'meta';
    const num = document.createElement('p'); num.className = 'num'; num.textContent = String(i + 1).padStart(2, '0');
    const h = document.createElement('h3'); h.textContent = v.titolo;
    meta.append(num, h);
    a.append(img, meta);
    grid.append(a);
  });

  let corrente = -1;

  function mostra(i, autoplay) {
    i = (i + video.length) % video.length;
    if (i === corrente) return;
    corrente = i;
    const v = video[i];
    const iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.youtube) +
                 '?rel=0&modestbranding=1' + (autoplay ? '&autoplay=1' : '');
    iframe.title = v.titolo;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    document.getElementById('player').replaceChildren(iframe);
    document.getElementById('now-title').textContent = v.titolo;
    document.getElementById('now-label').textContent = 'Video ' + String(i + 1).padStart(2, '0') + ' di ' + video.length;
    document.title = v.titolo + ' · GoGoBar';
    grid.querySelectorAll('.item').forEach(el => el.classList.toggle('attivo', el.dataset.id === v.youtube));
  }

  function vai(i) {
    i = (i + video.length) % video.length;
    history.replaceState(null, '', '#' + video[i].youtube);
    mostra(i, true);
  }

  // click su una copertina: cambia video e torna su al player
  grid.addEventListener('click', function (e) {
    const a = e.target.closest('.item');
    if (!a) return;
    e.preventDefault();
    vai(video.findIndex(v => v.youtube === a.dataset.id));
    document.getElementById('stage').scrollIntoView({ behavior: 'smooth' });
  });
  document.getElementById('prev').onclick = () => vai(corrente - 1);
  document.getElementById('next').onclick = () => vai(corrente + 1);

  // apertura da un link con #codice
  const id = location.hash.slice(1);
  const iniziale = video.findIndex(v => v.youtube === id);
  mostra(iniziale >= 0 ? iniziale : 0, false);
})();
</script>
</body>
</html>
